.hello{display:flex;flex-direction:column;gap:0}.hello span{font-size:14px;font-weight:700;color:var(--accent)}.hello b{font-family:var(--display);font-size:28px;line-height:1.15;letter-spacing:-.02em}

.cli-app .tabs,.cli-app .appnav{background:var(--sk-tabs);backdrop-filter:blur(10px)}
.cli-app .tabs button[aria-current="page"] svg,.cli-app .appnav button[aria-current="page"] svg{background:var(--accent-soft);border-radius:14px;padding:3px 12px;width:46px;box-sizing:content-box;margin:0 -12px}
.cli-app .chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.cli-app .wtile{border:0!important;color:#3A1730}.wtile .sub{color:#5B3550}.wtile .bar{background:rgba(255,255,255,.6)}
.cli-app .w-carte{background:linear-gradient(135deg,#E9DDFF,#FBE2F1)}.w-carte .bar i{background:#7B5BD6}
.cli-app .w-pack{background:linear-gradient(135deg,#FFD6CF,#FCE7D6)}.w-pack .bar i{background:var(--k)}
.cli-app .w-bon{background:linear-gradient(135deg,#FFE7A8,#FFD1DE);gap:12px}.wgift{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.7);display:grid;place-items:center;color:var(--accent);flex:none}
.cli-app .av{background:var(--sk-av)!important;color:var(--sk-av-ink)!important}
.phonewrap{display:flex;justify-content:center;padding:6px 0 30px}
.phone{position:relative;width:390px;height:844px;border-radius:58px;background:linear-gradient(180deg,#FFF0F6,#FFF9F4);border:12px solid #1D1A1F;box-shadow:0 0 0 2px #3A3540,0 0 0 4px #CFC7D2,0 40px 80px rgba(120,40,80,.28),inset 0 0 0 1px rgba(255,255,255,.4);overflow:hidden;display:flex;flex-direction:column}

.phone .sbar b{font-weight:700;letter-spacing:-.01em}.phone .sic{display:flex;align-items:flex-end;gap:2px}.phone .sic i{width:3.5px;background:#1D1A1F;border-radius:1px}

.phone .appscr{flex:1;overflow-y:auto;overflow-x:hidden;max-width:none;width:auto;border:0!important;border-radius:0;box-shadow:none!important;background:transparent!important;min-height:0;padding:6px 16px 90px;scrollbar-width:none}

.phone .homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#1D1A1F;z-index:7}

/* Choix du skin dans Profil */
.skins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.skin{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);border-radius:18px}
.skin:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skin .sw{width:100%;aspect-ratio:3/4;border-radius:16px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.skin .sw i{position:absolute;width:62%;height:44%;top:-12%;right:-14%;border-radius:50%}
.skin .sw u{position:absolute;left:16%;right:16%;top:44%;height:14%;border-radius:6px;background:rgba(255,255,255,.85)}
.skin .sw s{position:absolute;right:12%;bottom:10%;width:46%;height:13%;border-radius:999px}
.skin .sw b{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff}
.skin .sw b svg{width:12px;height:12px}
.skin[aria-pressed="true"]{font-weight:800}.skin[aria-pressed="true"] .sw{box-shadow:0 0 0 2.5px var(--ink),inset 0 0 0 1px rgba(0,0,0,.06)}
/* Fleurs et feuillages en filigrane : appli de la cliente seulement */
body.cli-app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background:var(--sk-f1) right -70px top -60px/260px no-repeat,var(--sk-f2) left -90px bottom 40px/280px no-repeat}
body.cli-app #app,body.cli-app main{position:relative;z-index:1}
.phone{background:var(--sk-f1) right -90px top 40px/230px no-repeat,var(--sk-f2) left -100px bottom 30px/260px no-repeat,var(--sk-phone)!important}
.cli-app .phone .sbar{color:var(--sk-sbar)}.cli-app .phone .sic i{background:var(--sk-sbar)}
.phone .appscr .card,.phone .appscr .item,.cli-app .card,.cli-app .item{backdrop-filter:blur(2px)}
.cli-app .card:not(.wtile):not(.nextrdv),.cli-app .item{background:var(--sk-card)}
.cli-app .hello{position:relative;padding-right:70px}
.cli-app .hello::after{content:'';position:absolute;right:0;top:-6px;width:64px;height:64px;background:var(--sk-f3) center/contain no-repeat}
/* Barre de statut de l'iPhone quand l'appli est installée */
body.cli-app::after{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--sk-status);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:60}
body.cli-app main{padding-top:env(safe-area-inset-top,0px)}
/* Le bouton Réserver ne cache plus le bas de la page, et les onglets ne se chevauchent plus */
body.cli-app main{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.tabs button span,.appnav button span{font-size:clamp(9px,2.7vw,11px);max-width:100%;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.tabs .in,.appnav .in{gap:0}
.l-short{display:none}@media (max-width:370px){.tabs .l-long{display:none}.tabs .l-short{display:inline}}.phone .l-long{display:none}.phone .l-short{display:inline}.phone .appnav button span{font-size:11px}
.appcli{max-width:430px;margin:0 auto;width:100%;border:1px solid var(--line);border-radius:30px;background:var(--bg);padding:20px 16px 0;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-height:72vh}
.appnav{position:sticky;bottom:0;margin:auto -16px 0;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 30px 30px;padding:6px 6px 12px;z-index:3}
.tabs button span,.appnav button span{white-space:nowrap}.appnav .in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.appnav button{border:0;background:none;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--faint)}
.appnav button[aria-current="page"],.tabs button[aria-current="page"]{color:var(--accent)}.appnav svg{width:22px;height:22px}
.appcli{position:relative;padding-bottom:0}.appcli>.appnav{margin-top:auto}.appcli .appfab{display:flex!important;position:absolute;right:16px;bottom:90px;z-index:4}.appcli>.appnav::before{content:'';display:block;height:64px;margin:-70px -6px 6px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.nextrdv{gap:6px;background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%)}.nextrdv .nr-d{font-family:var(--display);font-size:22px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}.qa button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink)}.qa svg{width:20px;height:20px;color:var(--accent)}
.vuecli{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--sunk);border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin:0 0 14px}.vuecli .sub{flex-basis:100%}
.affiche-d{border:2px solid var(--ink);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;background:#fff;color:#111}.affiche-d .a-t{font-family:var(--display);font-size:24px}.affiche-d .a-g{font-size:17px}.affiche-d ul{margin:0;padding-left:20px;line-height:1.5}
@media print{body *{visibility:hidden!important}.sheet .tk,.sheet .tk *,.sheet .affiche-d,.sheet .affiche-d *{visibility:visible!important}.sheet .tk,.sheet .affiche-d{position:fixed;left:0;top:0;box-shadow:none;border-radius:0}.sheet .tk{width:72mm;border:0;padding:0;font-size:11px}.sheet .affiche-d{width:180mm;font-size:18px}@page{margin:4mm}}
.tk-dup{text-align:center;font-weight:800;letter-spacing:.12em;border:1.5px solid #1c1a17;padding:2px;margin:4px 0}.notice.ok svg{color:var(--ok)}
.share{display:grid;gap:10px}.qr{display:flex;gap:14px;align-items:center}.qrbox{width:112px;height:112px;flex-shrink:0;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px;box-sizing:border-box}
.guide summary{cursor:pointer;list-style:none;display:flex;align-items:center}.guide summary::-webkit-details-marker{display:none}.guide summary b{display:flex;gap:8px;align-items:center}.guide summary::after{content:'+';margin-left:auto;font-weight:800;color:var(--muted)}.guide[open] summary::after{content:'−'}.guide ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
.gdot{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-size:12px;font-weight:800}.snip{display:block;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:12px;word-break:break-all;color:var(--ink)}
.consent{gap:10px;align-items:flex-start;font-weight:500;line-height:1.4}.consent input{width:20px;height:20px;flex-shrink:0;margin:0}
.mail{display:flex;flex-direction:column;gap:8px}.mh{display:flex;gap:10px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}.mbtn{font-size:12px;font-weight:700;padding:6px 10px;border-radius:14px;border:1px solid var(--line)}.mbtn.acc{background:var(--accent);color:var(--accent-ink);border-color:transparent}
@media (min-width:1000px){.share{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:start}}

.wm{font-family:'Kristi',cursive;font-weight:400;letter-spacing:0;color:#141210;filter:url(#ink);display:inline-block;transform:rotate(-3deg);line-height:1;padding:0 .08em .06em 0}
.logo .wm{font-size:1.75em;margin-top:2px}

.infos{display:flex;flex-direction:column;gap:6px}.infos hr{border:0;border-top:1px solid var(--line);width:100%;margin:4px 0}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}

/* Layout: one phone-width column; mode switch (salon / cliente) on top, tab bar pinned at the bottom, bottom sheets for details */
:root{
  --bg:#FBF8F6; --surface:#FFFFFF; --sunk:#F3ECF0; --line:#E8DDE3; --line2:#F1E8ED;
  --ink:#241A22; --muted:#5E5159; --faint:#867880;
  --accent:#6B2D5C; --accent-ink:#FFFFFF; --accent-soft:#EFE3EB;
  --k:#A85558; --k-ink:#7A3438; --k-soft:#F8ECEC; --k-on:#FFFFFF;
  --ok:#2E6B45; --ok-soft:#E3EFE6; --warn:#8A5A12; --warn-soft:#FBEEDB; --bad:#9B2C2C; --bad-soft:#F8E5E5;
  --cire:#F7E6D6; --cire-ink:#7A4416; --visage:#DFEDEF; --visage-ink:#1F5560; --cils:#ECE2F5; --cils-ink:#4E2C6E;
  --ongles:#F8E0E7; --ongles-ink:#7A2840; --corps:#E2EFDF; --corps-ink:#2F5A2A;
  --off:#F4EFF2; --now:#C2410C;
  --display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --body:'Manrope','Segoe UI',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(36,26,34,.06),0 4px 14px rgba(36,26,34,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17121A; --surface:#211A23; --sunk:#2A222D; --line:#3A303D; --line2:#2E2631;
  --ink:#F3ECF1; --muted:#C2B5BE; --faint:#9D909A;
  --accent:#D9A3CB; --accent-ink:#2A1426; --accent-soft:#3A2836;
  --k:#E09A9D; --k-ink:#F2C3C4; --k-soft:#3A2526; --k-on:#2B1213;
  --ok:#8FD0A6; --ok-soft:#1F3427; --warn:#E9BE7A; --warn-soft:#3A2C17; --bad:#F0A0A0; --bad-soft:#3D2222;
  --cire:#3A2A1C; --cire-ink:#F0C9A3; --visage:#1C3236; --visage-ink:#A7D6DE; --cils:#2E2340; --cils-ink:#D2BDEB;
  --ongles:#3B2129; --ongles-ink:#F1B3C6; --corps:#1F3320; --corps-ink:#AEDBA6;
  --off:#1E1820; --now:#FB923C; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121A; --surface:#211A23; --sunk:#2A222D; --line:#3A303D; --line2:#2E2631;
  --ink:#F3ECF1; --muted:#C2B5BE; --faint:#9D909A;
  --accent:#D9A3CB; --accent-ink:#2A1426; --accent-soft:#3A2836;
  --k:#E09A9D; --k-ink:#F2C3C4; --k-soft:#3A2526; --k-on:#2B1213;
  --ok:#8FD0A6; --ok-soft:#1F3427; --warn:#E9BE7A; --warn-soft:#3A2C17; --bad:#F0A0A0; --bad-soft:#3D2222;
  --cire:#3A2A1C; --cire-ink:#F0C9A3; --visage:#1C3236; --visage-ink:#A7D6DE; --cils:#2E2340; --cils-ink:#D2BDEB;
  --ongles:#3B2129; --ongles-ink:#F1B3C6; --corps:#1F3320; --corps-ink:#AEDBA6;
  --off:#1E1820; --now:#FB923C; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.3px}
.seg{display:inline-grid;grid-auto-flow:column;gap:3px;padding:3px;border-radius:22px;background:var(--sunk)}
.seg button{height:34px;padding:0 13px;border:0;border-radius:18px;background:transparent;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:110px}
h1{font-family:var(--display);font-weight:700;font-size:27px;letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:15px;margin:0;font-weight:800}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
.small{font-size:12.5px}
.tag{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.list{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;white-space:nowrap;flex-shrink:0}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{min-height:48px;border-radius:24px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;padding:0 20px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.k{background:var(--k);color:var(--k-on)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.sm{min-height:38px;font-size:13px;width:auto;padding:0 14px}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:800;font-size:13.5px;text-align:left}
.ibtn{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex-shrink:0}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:10px;white-space:nowrap;background:var(--sunk);color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.k{background:var(--k);color:var(--k-on)}
.pill.ks{background:var(--k-soft);color:var(--k-ink)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.notice{border-radius:14px;padding:11px 13px;font-size:13.5px;background:var(--accent-soft);display:flex;gap:10px;align-items:flex-start}
.notice.k{background:var(--k-soft)}
.notice.warn{background:var(--warn-soft)}
.notice svg{flex-shrink:0;margin-top:1px}
.av{width:38px;height:38px;border-radius:19px;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0;background:var(--accent-soft);color:var(--accent)}
.av.lg{width:64px;height:64px;border-radius:32px;font-size:22px}
.av.sm{width:26px;height:26px;font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:800}
.field input,.field select,.field textarea{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 13px;font-weight:500;font-size:15px;width:100%;min-width:0}
.field textarea{min-height:80px;resize:vertical}
.err{color:var(--bad);font-size:12.5px;font-weight:700}
.err:empty{display:none}

    if(!ok.length){toast('Ces photos n’ont pas pu être lues. Essayez en JPEG ou PNG.');return}

    ok.forEach(src=>S.vitrine.photos.push({id:uid(),src,label:''}));
    if(STORE_OK&&!save()){S.vitrine.photos.splice(-ok.length);if(!S.vitrine.photos.length)S.vitrine=Object.assign(S.vitrine,{photos:defaultVitrine().photos});toast('Mémoire du navigateur pleine : supprimez une photo puis réessayez');render(true);return}
    render(true);toast(ok.length>1?ok.length+' photos ajoutées':'Photo ajoutée');
  });
}

const SOIN=id=>S.catalogue.find(s=>s.id===id);
const CLIENT=id=>S.clients.find(c=>c.id===id);
const rdvPrice=r=>r.soins.reduce((a,id)=>a+SOIN(id).prix,0);
const rdvCat=r=>SOIN(r.soins[0]).cat;
const rdvNames=r=>r.soins.map(id=>{const s=SOIN(id);return s.cat==='laser'?'Laser '+s.nom.toLowerCase():s.nom}).join(' + ');
const kPartner=()=>S.kookla.statut==='actif'&&S.kookla.niveau==='partenaire';
const plus=()=>S.formule==='plus';
function workRanges(p,date){if(S.conges.some(c=>c.prat===p&&c.date===date))return [];return PRATS[p].h[dow(date)]||[]}
function busy(p,date,a,b,ignore){return S.rdv.some(r=>r.id!==ignore&&r.prat===p&&r.date===date&&r.statut!=='annule'&&a<r.start+r.dur&&r.start<b)}
function canDo(p,ids){return ids.every(id=>SOIN(id).prats.includes(p))}
function slotsFor(date,ids,pref,ignore){
  if(!ids.length)return [];
  const dur=ids.reduce((a,id)=>a+SOIN(id).dur,0);
  if(date<TODAY)return [];
  const min=date===TODAY?nowMin()+S.reglages.delai:0;
  const prats=(pref&&pref!=='any')?[pref]:PK.filter(p=>canDo(p,ids));
  const m=new Map();
  prats.forEach(p=>workRanges(p,date).forEach(([a,b])=>{for(let t=a;t+dur<=b;t+=15){if(t<min)continue;if(!busy(p,date,t,t+dur,ignore)&&!m.has(t))m.set(t,p)}}));
  return [...m.entries()].sort((x,y)=>x[0]-y[0]).map(([t,p])=>({t,p}));
}
function clientStats(id){
  const rs=S.rdv.filter(r=>r.client===id);
  const done=rs.filter(r=>r.statut==='honore');
  const spent=done.reduce((a,r)=>a+(r.paid?r.paid.montant:rdvPrice(r)),0);
  const past=rs.filter(r=>r.date<TODAY||(r.date===TODAY&&r.start<nowMin())).sort((a,b)=>(b.date+hh(b.start)).localeCompare(a.date+hh(a.start)));
  const next=rs.filter(r=>r.statut!=='annule'&&(r.date>TODAY||(r.date===TODAY&&r.start>=nowMin()))).sort((a,b)=>(a.date+hh(a.start)).localeCompare(b.date+hh(b.start)));
  const first=rs.slice().sort((a,b)=>(a.date+hh(a.start)).localeCompare(b.date+hh(b.start)))[0];
  return {visites:done.length,spent,absences:rs.filter(r=>r.statut==='absent').length,last:past[0]||null,next,past,first};
}
const isNew=r=>{const st=clientStats(r.client);return st.first&&st.first.id===r.id};

function weekGrid(week,px){
  const H=(GE-GS)*px;
  const head=`<div class="wgh"><span></span>${week.map(x=>{const n=S.rdv.filter(r=>r.date===x&&r.statut!=='annule'&&(S.filtre==='all'||r.prat===S.filtre)).length;
    return `<button class="wgd ${x===TODAY?'today':''}" data-a="goday" data-v="${x}"><small>${JOURS[dow(x)].replace('.','')}</small><b>${fromIso(x).getDate()}</b><em>${n?n+' RDV':'—'}</em></button>`}).join('')}</div>`;
  const cols=week.map(x=>{
    const prats=PK.filter(p=>S.filtre==='all'||S.filtre===p);
    const ranges=prats.flatMap(p=>workRanges(p,x));
    let offs='',seg=null;
    for(let m=GS;m<GE;m+=15){const w=ranges.some(([a,b])=>m>=a&&m<b);
      if(!w&&seg===null)seg=m;
      if(seg!==null&&(w||m+15>=GE)){const end=w?m:GE;offs+=`<div class="off" style="top:${(seg-GS)*px}px;height:${(end-seg)*px}px"></div>`;seg=null}}
    const rs=S.rdv.filter(r=>r.date===x&&r.statut!=='annule'&&(S.filtre==='all'||r.prat===S.filtre)).sort((a,b)=>a.start-b.start||a.prat.localeCompare(b.prat));
    const pos=[],nl=[];let cl=[],clEnd=-1,lanes=[];
    const flush=()=>{cl.forEach(k=>nl[k]=lanes.length);cl=[];lanes=[]};
    rs.forEach((r,j)=>{if(r.start>=clEnd){flush();clEnd=0}let i=lanes.findIndex(e=>e<=r.start);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=r.start+r.dur;pos[j]=i;cl.push(j);clEnd=Math.max(clEnd,r.start+r.dur)});
    flush();
    const blks=rs.map((r,j)=>{const n=nl[j]||1;return blkHTML(r,px,`left:calc(${pos[j]/n*100}% + 2px);right:auto;width:calc(${100/n}% - 4px);`,true)}).join('');
    return `<div class="cb" data-a="grid" data-date="${x}" data-px="${px}" style="height:${H}px;--hour:${60*px}px">${offs}${blks}${nowLine(x,px)}</div>`;
  }).join('');

function kStats(){

  const mois=kr.filter(r=>r.date>=mStart&&r.date<=TODAY);

  const nouvelles=[...kc].filter(id=>{const st=clientStats(id);return st.first&&st.first.date>=addDays(TODAY,-30)}).length||kc.size;

}

/* ----- caisse conforme (démo) ----- */
const CAISSE_V='Agendelle Caisse 1.0';
const SOC={rs:'Institut Écusson SAS',adr:'Rue de la Démo, 34000 Montpellier',siret:'000 000 000 00000',tva:'FR00000000000'};
const PRODUITS=[['p1','Crème hydratante',29],['p2','Sérum éclat',39],['p3','Huile sèche',24],['p4','Baume lèvres',9],['p5','Lime et soin ongles',12],['p6','Bon cadeau 50 €',50]];
const MOTIFS=['Erreur d’encaissement','Prestation non réalisée','Geste commercial','Retour produit'];
const sha256=(function(){const K=[];let n=2,c=0;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};while(c<64){if(isP(n)){K[c++]=(Math.pow(n,1/3)%1)*4294967296|0}n++}
  return function(str){const b=unescape(encodeURIComponent(str));const l=b.length;const w=[];for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);w[l>>2]|=0x80<<(24-(l%4)*8);const nb=((l+8)>>6)+1;w[nb*16-1]=l*8;
    let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const W=new Array(64);const r=(x,y)=>(x>>>y)|(x<<(32-y));
    for(let j=0;j<nb*16;j+=16){let [a,bb,cc,d,e,f,g,h]=H;for(let i=0;i<64;i++){if(i<16)W[i]=w[j+i]|0;else{const s0=r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3),s1=r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)|0}
      const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+W[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&cc)^(bb&cc)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
      H=[a,bb,cc,d,e,f,g,h].map((x,i)=>(x+H[i])|0)}
    return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}})();
const r2=n=>Math.round(n*100)/100;
const nTk=n=>String(n).padStart(6,'0');
const tsOf=(date,min)=>date+'T'+pad(Math.floor(min/60))+':'+pad(min%60);
const tsNow=()=>{const d=new Date();return TODAY+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const tsLabel=ts=>dshort(ts.slice(0,10))+' '+fromIso(ts.slice(0,10)).getFullYear()+' à '+ts.slice(11,13)+'h'+ts.slice(14,16);
function body(o){const x={...o};delete x.prev;delete x.h;return JSON.stringify(x)}
function chain(list,o){o.prev=list.length?list[list.length-1].h:'0'.repeat(64);o.h=sha256(o.prev+'|'+body(o));list.push(o);return o}
function jrnl(ev,d,ref,ts){return chain(S.caisse.jn,{n:S.caisse.jn.length+1,ts:ts||tsNow(),ev,d,ref:ref==null?null:ref})}
function addTicket(t,ts){const C=S.caisse;t={n:C.tk.length+1,ts:ts||tsNow(),...t};t.date=t.ts.slice(0,10);chain(C.tk,t);C.gt=r2(C.gt+t.ttc);
  jrnl(t.type==='avoir'?'avoir':'ticket',(t.type==='avoir'?'Avoir n° '+nTk(t.n)+' sur ticket n° '+nTk(t.ref)+' · ':'Ticket n° '+nTk(t.n)+' · ')+eur(t.ttc),t.n,t.ts);return t}

function autoClose(){const C=S.caisse;const done=new Set(C.cl.map(c=>c.type+c.per));const days=[...new Set(C.tk.map(t=>t.date))].filter(d=>d<TODAY).sort();
  const curM=TODAY.slice(0,7),curY=TODAY.slice(0,4);let prevM=null,prevY=null;
  const closeM=m=>{if(m&&m<curM&&!done.has('mois'+m)){const last=fromIso(m+'-01');last.setMonth(last.getMonth()+1);last.setDate(0);closeOne('mois',m,iso(last)+'T23:59');done.add('mois'+m)}};
  const closeY=y=>{if(y&&y<curY&&!done.has('annee'+y)){closeOne('annee',y,y+'-12-31T23:59');done.add('annee'+y)}};
  days.forEach(d=>{const m=d.slice(0,7),y=d.slice(0,4);if(prevM&&m!==prevM)closeM(prevM);if(prevY&&y!==prevY)closeY(prevY);

/* Offres en vente (bons, cartes de séances, abonnements). Une offre déjà achetée n'est jamais effacée :
   elle est retirée de la vente, et ce que les clientes ont acheté (séances restantes, bons, prix payé) ne change pas. */
const OTYPES={bonlibre:'Bon cadeau libre',bon:'Bon cadeau prestation',carte:'Carte de séances',abo:'Abonnement'};
function OFFRES(){
  if(!S.offres){const pr=S.produits||{};
    S.offres=[{id:'bon-libre',type:'bonlibre',nom:'Bon cadeau libre',prix:0,validite:12},
      {id:'bon-soin',type:'bon',nom:'Bon « Soin hydratant »',prix:65,validite:12,contenu:''},
      {id:'bon-pause',type:'bon',nom:'Bon « Pause beauté »',prix:64,validite:12,contenu:'Soin éclat + beauté des mains'},
      {id:'carte-dj',type:'carte',nom:'Carte 5 demi-jambes',prix:93,seances:5,remise:15,validite:12},
      {id:'carte-rh',type:'carte',nom:'Carte 10 rehaussements',prix:495,seances:10,remise:10,validite:18},
      {id:'abo-visage',type:'abo',nom:'Abonnement visage',prix:55,contenu:'1 soin hydratant par mois'}].map(o=>({...o,actif:pr[o.id]!==false&&(o.id!=='abo-visage'||!!pr[o.id]),retire:false}));
    /* Relie les achats déjà faits à leur offre, une fois pour toutes (le nom de l'offre pourra ensuite changer) */
    S.offres.forEach(o=>{(S.ventes||[]).forEach(v=>{if(!v.offre&&v.nom===o.nom)v.offre=o.id});(S.clients||[]).forEach(c=>{if(c.carte&&!c.carte.offre&&c.carte.nom===o.nom)c.carte.offre=o.id})})}
  return S.offres}
function OFFRE(id){return OFFRES().find(o=>o.id===id)}
function offreEnVente(type){return OFFRES().some(o=>o.actif&&!o.retire&&(!type||type.split('|').includes(o.type)))}
function offreAcheteuses(o){const ids=new Set();(S.ventes||[]).forEach(v=>{if(v.offre===o.id)ids.add('v'+v.id)});(S.clients||[]).forEach(c=>{if(c.carte&&c.carte.offre===o.id)ids.add('c'+c.id)});return ids.size}
function offreResume(o){const val=o.validite?`à utiliser en ${o.validite} mois`:'';
  if(o.type==='bonlibre')return ['Montant au choix de l’acheteuse',o.validite?`valable ${o.validite} mois`:''].filter(Boolean).join(' · ');
  if(o.type==='bon')return [o.contenu,o.validite?`valable ${o.validite} mois`:'',eur(o.prix)].filter(Boolean).join(' · ');
  if(o.type==='carte')return [`${o.seances} séances`,o.remise?`−${o.remise} %`:'',val,eur(o.prix)].filter(Boolean).join(' · ');
  return [o.contenu,eur(o.prix)+'/mois'].filter(Boolean).join(' · ')}

function vStats(){
  const per=S.statPer||7;const from=addDays(TODAY,-(per-1));
  const rs=S.rdv.filter(r=>r.date>=from&&r.date<=TODAY&&r.statut!=='annule');
  const prev=S.rdv.filter(r=>r.date>=addDays(from,-per)&&r.date<from&&r.statut!=='annule');
  const ca=a=>a.filter(r=>r.statut==='honore').reduce((x,r)=>x+(r.paid?r.paid.montant:rdvPrice(r)),0);
  const caN=ca(rs),caP=ca(prev);const evo=caP?Math.round((caN-caP)/caP*100):0;
  let capm=0;for(let i=0;i<per;i++){const d=addDays(from,i);capm+=PK.reduce((a,p)=>a+workRanges(p,d).reduce((y,[s,e])=>y+e-s,0),0)}
  const occ=capm?Math.round(rs.reduce((a,r)=>a+r.dur,0)/capm*100):0;
  const abs=rs.length?Math.round(rs.filter(r=>r.statut==='absent').length/rs.length*100):0;
  const nouv=rs.filter(isNew).length;
  const days=[...Array(per)].map((_,i)=>addDays(from,i));
  const vals=days.map(d=>ca(rs.filter(r=>r.date===d)));
  const mx=Math.max(...vals,1);const W=320,Hc=120,bw=W/per;
  const bars=vals.map((v,i)=>`<rect x="${i*bw+bw*.18}" y="${Hc-v/mx*(Hc-14)}" width="${bw*.64}" height="${Math.max(v/mx*(Hc-14),v?2:0)}" rx="${Math.min(4,bw*.3)}" fill="${days[i]===TODAY?'var(--k)':'var(--accent)'}"/>`).join('');
  const labels=per===7?days.map((d,i)=>`<text x="${i*bw+bw/2}" y="${Hc+14}" text-anchor="middle">${JOURS[dow(d)].replace('.','')}</text>`).join(''):[0,Math.floor(per/2),per-1].map(i=>`<text x="${i*bw+bw/2}" y="${Hc+14}" text-anchor="middle">${dshort(days[i])}</text>`).join('');
  const top={};rs.forEach(r=>r.soins.forEach(id=>{top[id]=(top[id]||0)+1}));
  const topL=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);const tmax=topL[0]?topL[0][1]:1;
  const src={'en ligne':0,'téléphone':0,'kookla':0};rs.forEach(r=>src[r.source]++);const tot=rs.length||1;
  return `<h1>Statistiques</h1>
  <div class="seg" role="group" aria-label="Période"><button data-a="statper" data-v="7" aria-pressed="${per===7}">7 jours</button><button data-a="statper" data-v="30" aria-pressed="${per===30}">30 jours</button></div>
  <div class="kpis"><div class="kpi"><b>${eur(caN)}</b><span>CA <span style="color:${evo>=0?'var(--ok)':'var(--bad)'}">${evo>=0?'+':''}${evo} %</span></span></div><div class="kpi"><b>${occ} %</b><span>remplissage</span></div><div class="kpi"><b>${rs.length}</b><span>rendez-vous</span></div>
  <div class="kpi"><b>${nouv}</b><span>nouvelles</span></div><div class="kpi"><b>${abs} %</b><span>absences</span></div><div class="kpi"><b>${eur(rs.filter(r=>r.statut==='honore').length?caN/rs.filter(r=>r.statut==='honore').length:0)}</b><span>panier moyen</span></div></div>
  <div class="card col"><b>Chiffre d’affaires par jour</b><svg class="chart" viewBox="0 0 ${W} ${Hc+20}" width="100%" role="img" aria-label="Chiffre d’affaires par jour">${bars}${labels}</svg></div>
  <div class="g2"><div class="card col"><b>D’où viennent les rendez-vous</b>
    <div style="display:flex;height:14px;border-radius:7px;overflow:hidden"><i style="width:${src['en ligne']/tot*100}%;background:var(--accent)"></i><i style="width:${src['téléphone']/tot*100}%;background:var(--faint)"></i><i style="width:${src.kookla/tot*100}%;background:var(--k)"></i></div>
    <div class="row wrap small" style="gap:12px"><span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:var(--accent)"></i>En ligne ${Math.round(src['en ligne']/tot*100)} %</span><span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:var(--faint)"></i>Téléphone ${Math.round(src['téléphone']/tot*100)} %</span><span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:var(--k)"></i>Kookla ${Math.round(src.kookla/tot*100)} %</span></div></div>
  <div class="card col"><b>Prestations les plus réservées</b>${topL.map(([id,n])=>`<div class="col" style="gap:4px"><div class="row between small"><span>${esc(SOIN(id).cat==='laser'?'Laser '+SOIN(id).nom.toLowerCase():SOIN(id).nom)}</span><b>${n}</b></div><div class="bar"><i style="width:${n/tmax*100}%;${SOIN(id).cat==='laser'?'background:var(--k)':''}"></i></div></div>`).join('')}</div>
  </div><p class="foot">Données d’exemple générées pour la démo.</p>`;
}

function vKClient(){
  const k=S.c.k;const lasers=S.catalogue.filter(s=>s.cat==='laser'&&s.actif);

  const step=k.step||'zone';
  const s=k.zone?SOIN(k.zone):null;
  if(step==='zone')return band+`<div class="notice k">${I.shield}<span>L’épilation laser de l’institut est vendue par <b>Kookla</b>, son partenaire. Même centre, même praticienne ; vos coordonnées sont reprises.</span></div><h2>Quelle zone ?</h2><div class="list">${lasers.map(z=>`<button class="item" data-a="k-zone" data-id="${z.id}"><span class="t"><b>${esc(z.nom)}</b><span>${z.dur} min · séance ${eur(z.prix)}</span></span><span class="col" style="align-items:flex-end"><span class="sub small">pack 8 dès</span><span class="price" style="color:var(--k-ink)">${eur(Math.round(pack(z.prix,8)/8))}/séance</span></span></button>`).join('')}</div>
    <div class="notice k">${I.shield}<span>Questionnaire d’éligibilité en ligne, revu par la laseriste du centre avant la première séance.</span></div>`;
  if(step==='formule'){
    const F=[['1','Séance seule',s.prix,1,''],['5','Pack 5 séances',pack(s.prix,5),5,'−15 %'],['8','Pack 8 séances',pack(s.prix,8),8,'−25 % · le plus choisi']];
    return band+cTop(esc(s.nom),'k-back',4,1,true)+`<div class="list">${F.map(([id,n,p,q,b])=>`<button class="opt k" data-a="k-form" data-v="${id}" aria-pressed="${k.formule===id}"><span class="row between"><b>${n}</b>${b?`<span class="pill ks">${b}</span>`:''}</span><span class="row between"><span class="sub small">${q>1?eur(Math.round(p/q))+' la séance':'Sans engagement'}</span><span class="price" style="font-size:17px">${eur(p)}</span></span></button>`).join('')}</div>
      <div class="list small">${['Séances versées à l’institut une à une, après chaque séance','Garantie anti-faillite : vos séances restantes sont protégées','Paiement en plusieurs fois disponible','Pack valable 24 mois'].map(x=>`<span class="row">${I.shield}<span>${x}</span></span>`).join('')}</div>
      <div class="cta"><div class="in"><button class="btn k" data-a="k-next" ${k.formule?'':'disabled'}>Choisir ma première séance</button></div></div>`;
  }
  if(step==='date'){
    const days=[...Array(21)].map((_,i)=>addDays(TODAY,i));
    const av_=days.map(d=>({d,n:slotsFor(d,[s.id],'maya').length}));
    if(!k.date||!av_.find(x=>x.d===k.date)){const f=av_.find(x=>x.n);k.date=f?f.d:TODAY}
    const sl=slotsFor(k.date,[s.id],'maya');
    return band+cTop('Première séance','k-back',4,2,true)+`
    <div class="daysc">${av_.map(({d,n})=>`<button class="dsc k ${n?'':'none'}" data-a="k-date" data-v="${d}" aria-pressed="${d===k.date}"><small>${JOURS[dow(d)].replace('.','')}</small><b>${fromIso(d).getDate()}</b><em>${n?n+' dispo':'complet'}</em></button>`).join('')}</div>
    <h3>${cap(dlabel(k.date))}</h3>${sl.length?`<div class="slots k">${sl.map(x=>`<button class="slot" data-a="k-slot" data-t="${x.t}" aria-pressed="${k.t===x.t&&k.tdate===k.date}">${hh(x.t)}</button>`).join('')}</div>`:'<p class="sub">Maya ne travaille pas ce jour-là ou c’est complet.</p>'}
    <p class="foot" style="text-align:left">Créneaux en temps réel depuis l’agenda de l’institut. Les séances suivantes se réservent depuis votre espace Kookla.</p>
    <div class="cta"><div class="in"><button class="btn k" data-a="k-next" ${k.t!=null&&k.tdate===k.date?'':'disabled'}>Continuer</button></div></div>`;
  }
  if(step==='compte')return band+cTop('Vos coordonnées','k-back',4,3,true)+`${me()?`<div class="notice ok">${I.check}<span>Reprises de votre réservation à l’institut. Pas de mot de passe : Kookla vous envoie un lien de connexion par email.</span></div>`:''}
    <form id="f-kc" class="list" novalidate>
      <label class="field" for="k-nom">Prénom et nom<input id="k-nom" autocomplete="name" value="${esc(k.nom||(me()?me().nom:''))}"></label>
      <label class="field" for="k-mail">Email<input id="k-mail" type="email" autocomplete="email" value="${esc(k.mail||(me()?me().mail:''))}"></label>
      <span class="err" id="k-err"></span>
      <button class="btn k" type="submit">Continuer</button>
      <p class="foot">Un compte Kookla est créé avec ces coordonnées pour suivre vos séances et votre garantie. Simulation.</p></form>`;
  if(step==='pay'){
    const F={'1':[s.prix,'Séance seule'],'5':[pack(s.prix,5),'Pack 5 séances'],'8':[pack(s.prix,8),'Pack 8 séances']}[k.formule];
    return band+cTop('Paiement','k-back',4,4,true)+`
    <div class="card col" style="gap:6px"><div class="row between"><b>Laser ${esc(s.nom.toLowerCase())} · ${F[1]}</b><b>${eur(F[0])}</b></div><span class="sub small">1re séance ${dlabel(k.tdate)} à ${hm(k.t)} avec Maya</span></div>
    <span class="tag">Moyen de paiement</span>
    <div class="list">${[['cb','Carte bancaire'],['apple','Apple Pay'],['klarna','En 3 ou 4 fois avec Klarna']].map(([id,l])=>`<button class="opt k" data-a="k-pm" data-v="${id}" aria-pressed="${(k.pm||'cb')===id}"><b>${l}</b>${id==='klarna'?`<span class="sub small">Soit ${eur(Math.round(F[0]/4*100)/100)} par mois sur 4 mois</span>`:''}</button>`).join('')}</div>
    <div class="notice k">${I.shield}<span>Garantie anti-faillite : l’institut est payé séance par séance. Droit de rétractation de 14 jours, détaillé dans les CGV Kookla.</span></div>
    <div class="cta"><div class="in"><button class="btn k" data-a="k-pay">Payer ${eur(F[0])} (simulation)</button></div></div>`;
  }
  if(step==='ok'){const r=S.rdv.find(x=>x.id===k.rdvId);
    return band+`<div class="card col" style="gap:10px;align-items:center;text-align:center;padding:24px 16px">
      <span style="width:58px;height:58px;border-radius:29px;background:var(--k-soft);color:var(--k-ink);display:grid;place-items:center">${I.check}</span>
      <h1 style="font-size:24px">Votre ${k.formule==='1'?'séance est réservée':'pack est activé'} !</h1>
      <p class="sub">1re séance <b style="color:var(--ink)">${r?cap(dlabel(r.date))+' à '+hm(r.start):''}</b> avec Maya</p>
      <span class="pill ks">K-Coins crédités sur votre compte Kookla</span>
      <p class="sub small">Reçu, CGV et droit de rétractation envoyés par email par Kookla.</p>
      <button class="btn k" data-a="c-mesrdv">Voir mes rendez-vous</button></div>
    <p class="foot">Astuce démo : côté salon, la séance apparaît dans l’agenda de Maya avec le badge Kookla.</p>`}
  return '';
}

  } else {
    main=vCliente();

    if(p==='mesrdv'&&me())nav=appNav('tabs');
    if(p==='home'||p==='mesrdv'){

    }
  }
  const topbar=`<header class="top"><span class="logo">${swallow(30,'var(--accent-ink)','var(--accent)')}<span class="wm">Agendelle</span></span>
    <div class="seg" role="group" aria-label="Point de vue"><button data-a="mode" data-v="salon" aria-pressed="${S.mode==='salon'}">Salon</button><button data-a="mode" data-v="cliente" aria-pressed="${S.mode==='cliente'}">Cliente</button></div></header>
    ${S.mode==='cliente'&&(S.c.page==='home'||S.c.page==='mesrdv')?vueCli()+(S.c.page==='home'&&S.c.viaApp&&me()?`<button class="link small" data-a="c-mesrdv" style="align-self:flex-start;margin:-2px 0 10px">${I.left} Retour à mon appli Agendelle</button>`:S.c.page==='home'?`<button class="link small" data-a="c-mesrdv" style="align-self:flex-start;margin:-2px 0 10px">+ Ajouter à mes rendez-vous Agendelle</button>`:''):`<span class="tag" style="margin:-4px 0 10px">Démo · données d’exemple</span>`}`;

let stripLeft=null,stripTimer=null;
function setupStrip(){
  const st=document.getElementById('dstrip');
  if(!st){stripLeft=null;return}
  const sel=st.querySelector('[aria-pressed="true"]');
  const target=sel?sel.offsetLeft-(st.clientWidth-sel.offsetWidth)/2:0;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(stripLeft!=null&&Math.abs(stripLeft-target)<st.clientWidth*3&&!reduce){st.scrollLeft=stripLeft;st.scrollTo({left:target,behavior:'smooth'})}
  else st.scrollLeft=target;
  st.addEventListener('scroll',()=>{
    stripLeft=st.scrollLeft;
    clearTimeout(stripTimer);
    stripTimer=setTimeout(()=>{
      const mid=st.scrollLeft+st.clientWidth/2;let best=null,bd=1e9;
      st.querySelectorAll('.d7').forEach(b=>{const c=b.offsetLeft+b.offsetWidth/2,dd=Math.abs(c-mid);if(dd<bd){bd=dd;best=b}});
      if(best&&best.dataset.v!==S.jour){S.jour=best.dataset.v;S.flash=null;try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}render(true)}
    },160);
  },{passive:true});
}

    case 'c-inst-ok':{const l=(document.getElementById('c-add-lien').value||'').trim().toLowerCase();const k=l.includes('spa')?'spa':l.includes('ongle')||l.includes('atelier')?'atelier':null;
      if(!k){toast('Lien non reconnu : vérifiez-le ou scannez le QR code');return}S.espace=S.espace||{ajoutes:[]};if(!S.espace.ajoutes.includes(k))S.espace.ajoutes.push(k);S.sheet=null;render(true);toast(AUTRES[k].nom+' ajouté à votre espace');return}
    case 'c-autre':toast('Ouvre la page de '+AUTRES[v].nom+' (institut fictif, hors démo)');return;
    case 'c-login':{const v_=(document.getElementById('c-login-id').value||'').trim();if(v_.length<5){toast('Indiquez votre email');return}
      S.me=(S.clients.find(c=>c.mail===v_.toLowerCase())||S.clients[0]).id;S.c.at='accueil';toast('Lien de connexion envoyé · démo : vous êtes connectée');break}
    case 'c-logout':S.me=null;S.c.at='accueil';break;
    case 'c-at':S.c.at=v;S.sheet=null;window.scrollTo(0,0);break;
    case 'c-filtre':S.c.filtre=v;break;
    case 'c-resa':S.sheet={type:'c-resa'};break;
    case 'c-rebook':{const r=S.rdv.find(x=>x.id===id);S.sheet=null;return go(()=>{S.c.page='book';S.c.cart=r.soins.slice();S.c.editId=null;S.c.prat=r.prat;S.c.date=null;S.c.t=null;S.c.step='date'})}
    case 'c-avis':S.sheet={type:'c-avis',id};break;
    case 'avis-note':sh.note=+v;break;
    case 'avis-ok':{S.espace=S.espace||{ajoutes:[]};S.espace.avis=S.espace.avis||{};S.espace.avis[sh.id]=sh.note;S.sheet=null;render(true);toast('Merci ! Votre avis est publié (simulation)');return}
    case 'tk-cli':S.sheet={type:'tk-cli',n:+v};break;
    case 'qa-map':toast('Ouvre l’itinéraire dans Plans ou Google Maps (simulation)');return;
    case 'qa-call':toast('Appelle l’institut (simulation)');return;
    case 'qa-move':if(v==='ecusson'&&id){const r=S.rdv.find(x=>x.id===id);return go(()=>{S.c.page='book';S.c.cart=r.soins.slice();S.c.editId=r.id;S.c.prat=r.prat;S.c.date=r.date;S.c.t=null;S.c.step='date'})}toast('Ouvre la gestion du rendez-vous chez '+AUTRES[v].nom+' (hors démo)');return;
    case 'c-skin':{S.espace=S.espace||{ajoutes:[]};S.espace.skin=v;if(v!=='nuit'&&S.espace.skinAuto!==false&&telSombre()){S.espace.skinAuto=false}break}
    case 'c-skin-auto':{S.espace=S.espace||{ajoutes:[]};S.espace.skinAuto=S.espace.skinAuto===false;break}
    case 'c-notif-veille':case 'c-notif-attente':{S.espace=S.espace||{ajoutes:[]};const nt=S.espace.notif=S.espace.notif||{veille:true,attente:true};const k=a.slice(8);nt[k]=!nt[k];break}
    case 'c-optin-ecusson':{const m=me();m.optin=!m.optin;toast(m.optin?'Offres d’Institut Écusson acceptées':'Vous ne recevrez plus d’offres d’Institut Écusson');break}
    case 'c-optin-atelier':case 'c-optin-spa':{S.espace=S.espace||{ajoutes:[]};const o=S.espace.optins=S.espace.optins||{};const k=a.slice(8);o[k]=!o[k];break}
    case 'c-export':toast('Vos données sont téléchargées (simulation)');return;
    case 'c-tous':S.c.tous=true;break;
    case 'c-cal':toast('Ajout à l’agenda du téléphone : disponible dans la vraie appli');return;
    case 'c-edit':{const r=S.rdv.find(x=>x.id===id);return go(()=>{S.c.page='book';S.c.cart=r.soins.slice();S.c.editId=r.id;S.c.prat=r.prat;S.c.date=r.date;S.c.t=null;S.c.step='date'})}
    case 'c-cancel':S.c.cancelId=id;break;
    case 'c-cancel-no':S.c.cancelId=null;break;
    case 'c-cancel-yes':{const r=S.rdv.find(x=>x.id===id);const late=new Date(fromIso(r.date).getTime()+r.start*60000-S.reglages.annulation*3600000)<=new Date();const p=rdvPrice(r);let msg='Rendez-vous annulé';
      if(r.garantie===1&&late){r.penalite=p/2;msg='Annulé · 50 % débités ('+eur(p/2)+')'}
      else if(r.garantie===2){if(late){r.penalite=p/2;if(r.paid)r.paid.montant=p/2;msg='Annulé · '+eur(p/2)+' remboursés'}else{r.paid=null;msg='Annulé · remboursement intégral'}}
      r.statut='annule';r.late=late;S.c.cancelId=null;render(true);toast(msg);return}
    case 'g-open':return go(()=>{S.mode='cliente';S.c.page='gift';S.c.g={montant:80}});
    case 'g-m':S.c.g.montant=+v;break;
    /* kookla cliente */
    case 'k-open':return go(()=>{S.c.page='kookla';S.c.k={step:'zone'}});
    case 'k-close':return go(()=>{S.c.page='home'});
    case 'k-zone':return go(()=>{S.c.page='kookla';S.c.k={step:'formule',zone:id,formule:'8'}});
    case 'k-form':S.c.k.formule=v;break;
    case 'k-back':return go(()=>{const k=S.c.k;k.step={formule:'zone',date:'formule',compte:'date',pay:'compte'}[k.step]||'zone'});
    case 'k-next':return go(()=>{const k=S.c.k;if(k.step==='formule'&&k.formule)k.step='date';else if(k.step==='date'&&k.t!=null)k.step='compte'});
    case 'k-date':S.c.k.date=v;break;
    case 'k-slot':S.c.k.t=+el.dataset.t;S.c.k.tdate=S.c.k.date;break;
    case 'k-pm':S.c.k.pm=v;break;
    case 'k-pay':return go(()=>{const k=S.c.k,s=SOIN(k.zone);
      if(busy('maya',k.tdate,k.t,k.t+s.dur)){toast('Ce créneau vient d’être pris, choisissez-en un autre');k.step='date';k.t=null;return}
      const m=ensureMe(k.nom,'',k.mail);m.kookla=true;
      const r={id:uid(),date:k.tdate,start:k.t,dur:s.dur,soins:[s.id],prat:'maya',client:m.id,statut:'confirme',source:'kookla',paid:null,acompte:0,note:'',pack:k.formule==='1'?'Séance seule':'Pack 1/'+k.formule};
      S.rdv.push(r);if(k.formule!=='1')S.packsMois++;k.rdvId=r.id;k.step='ok'});
    default:return;
  }
  render(true);
});
function selectLien(){const n=document.getElementById('lien');if(!n)return;const r=document.createRange();r.selectNodeContents(n);const s=window.getSelection();s.removeAllRanges();s.addRange(r)}
function ensureMe(nom,tel,mail){
  let m=me();
  if(!m){m={id:'me',nom:nom||'Vous',tel:tel||'—',mail:mail||'',notes:'',optin:false,kookla:false,carte:null};S.clients.push(m);S.me='me'}
  else{if(nom)m.nom=nom;if(tel)m.tel=tel;if(mail)m.mail=mail}
  return m;
}
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;const val=id=>{const n=document.getElementById(id);return n?n.value.trim():''};
  const err=(id,m)=>{const n=document.getElementById(id);if(n)n.textContent=m};
  if(f.id==='f-book'){const c=S.c;const nom=val('b-nom'),tel=val('b-tel'),mail=val('b-mail');
    c.form={nom,tel,mail,note:val('b-note')};
    if(!nom||!tel)return err('b-err','Indiquez votre nom et votre téléphone pour réserver.');
    if(mail&&!/^\S+@\S+\.\S+$/.test(mail))return err('b-err','L’adresse email n’est pas valide.');
    const dur=c.cart.reduce((a,id)=>a+SOIN(id).dur,0);
    if(busy(c.tp,c.tdate,c.t,c.t+dur,c.editId))return err('b-err','Ce créneau vient d’être pris. Revenez en arrière pour en choisir un autre.');
    const optEl=document.getElementById('b-optin');const G=c.editId?0:garantie();const cg=document.getElementById('b-cgv');
    if(G&&cg&&!cg.checked)return err('b-err','Cochez les conditions d’annulation pour réserver.');
    const m=ensureMe(nom,tel,mail);if(optEl)m.optin=optEl.checked;
    const tot=c.cart.reduce((a,id)=>a+SOIN(id).prix,0);
    let r;
    if(c.editId){r=S.rdv.find(x=>x.id===c.editId);r.date=c.tdate;r.start=c.t;r.prat=c.tp;r.soins=c.cart.slice();r.dur=dur}
    else{r={id:uid(),date:c.tdate,start:c.t,dur,soins:c.cart.slice(),prat:c.tp,client:m.id,statut:'confirme',source:'en ligne',paid:G===2?{mode:'En ligne',montant:tot,date:TODAY}:null,acompte:0,garantie:G,penalite:0,note:c.form.note,pack:''};S.rdv.push(r)}
    c.lastId=r.id;c.step='ok';c.cart=[];c.editId=null;c.t=null;S.jour=r.date;S.filtre='all';
    render(false);window.scrollTo(0,0);return;
  }
  if(f.id==='f-kc'){const k=S.c.k;k.nom=val('k-nom');k.mail=val('k-mail');
    if(!k.nom||!/^\S+@\S+\.\S+$/.test(k.mail))return err('k-err','Indiquez votre nom et un email valide.');
    k.step='pay';render(false);window.scrollTo(0,0);return}
  if(f.id==='f-gift'){const g=S.c.g;g.pour=val('g-pour');g.de=val('g-de');g.msg=val('g-msg');g.montant=g.montant||80;
    if(!g.pour||!g.de)return err('g-err','Indiquez pour qui et de la part de qui.');
    g.code='AGD-'+Math.random().toString(36).slice(2,6).toUpperCase();
    S.ventes.push({id:uid(),type:'Bon cadeau',nom:'Bon cadeau '+g.montant+' €',montant:g.montant,date:TODAY,acheteur:court(g.de)});
    render(false);window.scrollTo(0,0);return}
  if(f.id==='f-wait'){const nom=val('w-nom'),tel=val('w-tel');if(!nom||!tel)return err('w-err','Indiquez votre nom et votre téléphone.');
    S.attente.push({id:uid(),nom,soin:S.c.cart[0],date:S.c.date||TODAY});S.sheet=null;render(true);toast('Vous êtes sur la liste d’attente');return}
  if(f.id==='f-new'){const sh=S.sheet;const nom=val('n-cli'),s1=val('n-soin'),s2=val('n-soin2'),p=val('n-prat'),h=val('n-h'),date=val('n-date');
    if(!nom)return err('n-err','Indiquez le nom de la cliente.');if(!h||!date)return err('n-err','Indiquez la date et l’heure.');
    const ids=[s1].concat(s2&&s2!==s1?[s2]:[]);
    if(!canDo(p,ids))return err('n-err',PRATS[p].nom+' ne réalise pas '+(ids.length>1?'ces prestations':'cette prestation')+'.');
    const [H,M]=h.split(':').map(Number);const t=H*60+M;const dur=ids.reduce((a,x)=>a+SOIN(x).dur,0);
    if(!workRanges(p,date).some(([a,b])=>t>=a&&t+dur<=b))return err('n-err',PRATS[p].nom+' ne travaille pas sur ce créneau.');
    if(busy(p,date,t,t+dur))return err('n-err',PRATS[p].nom+' a déjà un rendez-vous à ce moment-là.');
    let c=S.clients.find(x=>x.nom.toLowerCase()===nom.toLowerCase());
    if(!c){c={id:'c'+uid(),nom,tel:'—',mail:'',notes:'',optin:false,kookla:false,carte:null};S.clients.push(c)}
    S.rdv.push({id:uid(),date,start:t,dur,soins:ids,prat:p,client:c.id,statut:'confirme',source:'téléphone',paid:null,acompte:0,note:val('n-note'),pack:''});
    S.sheet=null;S.jour=date;S.vue='jour';if(S.mode!=='salon'||S.tab!=='agenda'){S.mode='salon';S.tab='agenda';render(false);window.scrollTo(0,0)}else render(true);toast('Rendez-vous ajouté');return}
  if(f.id==='f-presta'){const s=SOIN(S.sheet.id);const prix=parseFloat(val('p-prix'));const prats=PK.filter(p=>document.getElementById('pp-'+p).checked);
    if(!(prix>=0))return err('p-err','Indiquez un prix valide.');if(!prats.length)return err('p-err','Choisissez au moins une praticienne.');
    s.prix=prix;s.dur=+val('p-dur');s.prats=prats;s.desc=val('p-desc');S.sheet=null;render(true);toast('Prestation enregistrée');return}
  if(f.id==='f-offre'){const sh=S.sheet,o=sh.id?OFFRE(sh.id):null,t=o?o.type:(sh.t||'carte');
    const nom=val('of-nom')||(t==='bonlibre'?'Bon cadeau libre':''),prix=t==='bonlibre'?0:parseFloat(val('of-prix').replace(',','.'));
    if(!nom)return err('of-err','Donnez un nom à l’offre.');
    if(t!=='bonlibre'&&!(prix>0))return err('of-err','Indiquez un prix valide.');
    const x={nom,prix:t==='bonlibre'?0:Math.round(prix*100)/100};
    if(t==='carte'){x.seances=parseInt(val('of-seances'),10);x.remise=parseInt(val('of-remise')||'0',10)||0;if(!(x.seances>=2))return err('of-err','Une carte compte au moins 2 séances.');if(x.remise<0||x.remise>90)return err('of-err','La remise doit être entre 0 et 90 %.')}
    if(t==='bon'||t==='abo')x.contenu=val('of-contenu');
    if(t!=='abo')x.validite=+val('of-val');
    if(OFFRES().some(y=>y!==o&&!y.retire&&y.nom.toLowerCase()===nom.toLowerCase()))return err('of-err','Une offre porte déjà ce nom.');
    if(o)Object.assign(o,x);else S.offres.push({id:'of'+uid(),type:t,...x,actif:true,retire:false});
    S.sheet=null;render(true);toast(o?'Offre enregistrée':'Offre créée et mise en vente');return}
  if(f.id==='f-conge'){const p=val('cg-p'),d=val('cg-d');if(!d)return err('cg-err','Choisissez une date.');
    if(S.conges.some(c=>c.prat===p&&c.date===d))return err('cg-err','Ce congé existe déjà.');
    S.conges.push({id:uid(),prat:p,date:d});S.sheet=null;render(true);toast('Congé ajouté');return}
  if(f.id==='f-nc'){const nom=val('nc-nom'),tel=val('nc-tel');if(!nom||!tel)return err('nc-err','Indiquez le nom et le téléphone.');
    const c={id:'c'+uid(),nom,tel,mail:val('nc-mail'),notes:'',optin:false,kookla:false,carte:null};S.clients.push(c);S.sheet=null;
    S.clientId=c.id;render(false);window.scrollTo(0,0);toast('Fiche créée');return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='tq'){S.tq=t.value;const l=document.getElementById('tk-list');if(l)l.innerHTML=tkListHTML();return}
  if((t.id==='pay-m1'||t.id==='pay-recu')&&S.sheet){const sh=S.sheet;const val=t.value.replace(',','.').replace(/[^0-9.]/g,'');if(t.id==='pay-m1')sh.m1=val;else sh.recu=val;const i=document.getElementById('pay-info');if(i)i.textContent=payInfo({...sh,p2:sh.p2&&sh.p2!==sh.p1?sh.p2:payModes(sh.type==='encaisser'?CLIENT(S.rdv.find(x=>x.id===sh.id).client):null).find(m=>m!==(sh.p1||'CB'))},sh.due);return}
  if(t.id==='cq'){S.cq=t.value;const l=document.getElementById('cl-list');if(l)l.innerHTML=clientsListHTML();return}
  if(t.id==='camp-msg'){const ch=t.dataset.canal||'sms';if(ch==='sms')S.campMsg=t.value;else S.campMail=t.value;const n=campCount();const nb=Math.max(1,Math.ceil(t.value.length/160));const i=document.getElementById('camp-info');if(i)i.textContent=ch==='sms'?t.value.length+' caractères · '+nb+' SMS par cliente · '+n+' clientes · '+n*nb+' crédits':n+' clientes ayant accepté les messages';save();return}
  if(t.id==='reg-msg'){S.reglages.message=t.value;save();return}
  if(t.id==='vit-desc'){S.vitrine.desc=t.value;const c=document.getElementById('vit-count');if(c)c.textContent=t.value.length+' / 600 caractères · enregistré automatiquement';save();return}
  if(t.closest('form')){const er=t.closest('form').querySelector('.err');if(er)er.textContent=''}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='ph-in'){if(t.files&&t.files.length)addPhotos(t.files);t.value='';return}
  if(t.id==='notes'){CLIENT(t.dataset.id).notes=t.value;save();toast('Note enregistrée');return}
  if(t.dataset.reg){S.reglages[t.dataset.reg]=+t.value;save();toast('Réglage enregistré');return}
  if(t.id==='camp-cible'){S.campCible=t.value;S.campConfirm=false;render(true);return}
  if(t.id==='m-date'){S.sheet.date=t.value;S.sheet.t=null;render(true);return}
  if(t.id==='m-prat'){S.sheet.prat=t.value;S.sheet.t=null;render(true);return}
});
document.addEventListener('keydown',e=>{
  if(S.sheet&&S.sheet.type==='photo'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const n=Math.max(1,S.vitrine.photos.length);S.sheet.i=(S.sheet.i+(e.key==='ArrowRight'?1:-1)+n)%n;render(true);return}
  if(e.key==='Escape'&&S.sheet){S.sheet=null;render(true)}});
let tx=null;
document.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('#lb'))tx=e.touches[0].clientX;else tx=null},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null||!S.sheet||S.sheet.type!=='photo')return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50){const n=Math.max(1,S.vitrine.photos.length);S.sheet.i=(S.sheet.i+(dx<0?1:-1)+n)%n;render(true)}},{passive:true});
render(false);
})();
</script>
