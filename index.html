<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Démo d'Agendelle, l'agenda en ligne des instituts de beauté : agenda, réservation, caisse, et épilation laser avec Kookla.">
<meta name="theme-color" content="#6B2D5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agendelle">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Agendelle démo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}

/* Layout: one phone-width column; mode switch (salon / cliente) on top, tab bar pinned at the bottom, bottom sheets for details */
:root{
  --bg:#FBF8F6; --surface:#FFFFFF; --sunk:#F3ECF0; --line:#E8DDE3; --line2:#F1E8ED;
  --ink:#241A22; --muted:#5E5159; --faint:#867880;
  --accent:#6B2D5C; --accent-ink:#FFFFFF; --accent-soft:#EFE3EB;
  --k:#A85558; --k-ink:#7A3438; --k-soft:#F8ECEC; --k-on:#FFFFFF;
  --ok:#2E6B45; --ok-soft:#E3EFE6; --warn:#8A5A12; --warn-soft:#FBEEDB; --bad:#9B2C2C; --bad-soft:#F8E5E5;
  --cire:#F7E6D6; --cire-ink:#7A4416; --visage:#DFEDEF; --visage-ink:#1F5560; --cils:#ECE2F5; --cils-ink:#4E2C6E;
  --ongles:#F8E0E7; --ongles-ink:#7A2840; --corps:#E2EFDF; --corps-ink:#2F5A2A;
  --off:#F4EFF2; --now:#C2410C;
  --display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --body:'Manrope','Segoe UI',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(36,26,34,.06),0 4px 14px rgba(36,26,34,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17121A; --surface:#211A23; --sunk:#2A222D; --line:#3A303D; --line2:#2E2631;
  --ink:#F3ECF1; --muted:#C2B5BE; --faint:#9D909A;
  --accent:#D9A3CB; --accent-ink:#2A1426; --accent-soft:#3A2836;
  --k:#E09A9D; --k-ink:#F2C3C4; --k-soft:#3A2526; --k-on:#2B1213;
  --ok:#8FD0A6; --ok-soft:#1F3427; --warn:#E9BE7A; --warn-soft:#3A2C17; --bad:#F0A0A0; --bad-soft:#3D2222;
  --cire:#3A2A1C; --cire-ink:#F0C9A3; --visage:#1C3236; --visage-ink:#A7D6DE; --cils:#2E2340; --cils-ink:#D2BDEB;
  --ongles:#3B2129; --ongles-ink:#F1B3C6; --corps:#1F3320; --corps-ink:#AEDBA6;
  --off:#1E1820; --now:#FB923C; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121A; --surface:#211A23; --sunk:#2A222D; --line:#3A303D; --line2:#2E2631;
  --ink:#F3ECF1; --muted:#C2B5BE; --faint:#9D909A;
  --accent:#D9A3CB; --accent-ink:#2A1426; --accent-soft:#3A2836;
  --k:#E09A9D; --k-ink:#F2C3C4; --k-soft:#3A2526; --k-on:#2B1213;
  --ok:#8FD0A6; --ok-soft:#1F3427; --warn:#E9BE7A; --warn-soft:#3A2C17; --bad:#F0A0A0; --bad-soft:#3D2222;
  --cire:#3A2A1C; --cire-ink:#F0C9A3; --visage:#1C3236; --visage-ink:#A7D6DE; --cils:#2E2340; --cils-ink:#D2BDEB;
  --ongles:#3B2129; --ongles-ink:#F1B3C6; --corps:#1F3320; --corps-ink:#AEDBA6;
  --off:#1E1820; --now:#FB923C; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.3px}
.seg{display:inline-grid;grid-auto-flow:column;gap:3px;padding:3px;border-radius:22px;background:var(--sunk)}
.seg button{height:34px;padding:0 13px;border:0;border-radius:18px;background:transparent;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:110px}
h1{font-family:var(--display);font-weight:700;font-size:27px;letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:15px;margin:0;font-weight:800}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
.small{font-size:12.5px}
.tag{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.list{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;white-space:nowrap;flex-shrink:0}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{min-height:48px;border-radius:24px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;padding:0 20px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.k{background:var(--k);color:var(--k-on)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.sm{min-height:38px;font-size:13px;width:auto;padding:0 14px}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:800;font-size:13.5px;text-align:left}
.ibtn{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex-shrink:0}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:10px;white-space:nowrap;background:var(--sunk);color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.k{background:var(--k);color:var(--k-on)}
.pill.ks{background:var(--k-soft);color:var(--k-ink)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.notice{border-radius:14px;padding:11px 13px;font-size:13.5px;background:var(--accent-soft);display:flex;gap:10px;align-items:flex-start}
.notice.k{background:var(--k-soft)}
.notice.warn{background:var(--warn-soft)}
.notice svg{flex-shrink:0;margin-top:1px}
.av{width:38px;height:38px;border-radius:19px;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0;background:var(--accent-soft);color:var(--accent)}
.av.lg{width:64px;height:64px;border-radius:32px;font-size:22px}
.av.sm{width:26px;height:26px;font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:800}
.field input,.field select,.field textarea{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 13px;font-weight:500;font-size:15px;width:100%;min-width:0}
.field textarea{min-height:80px;resize:vertical}
.err{color:var(--bad);font-size:12.5px;font-weight:700}
.err:empty{display:none}
.toggle{width:48px;height:28px;flex-shrink:0;border-radius:14px;border:0;padding:0;position:relative;background:var(--line)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{left:23px}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);width:100%;text-align:left}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item .t b{font-size:14.5px}
.item .t span{font-size:12.5px;color:var(--muted)}
.price{font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:22px 10px}
.foot{font-size:11.5px;color:var(--faint);text-align:center}
.cat-cire{background:var(--cire);color:var(--cire-ink)}.cat-visage{background:var(--visage);color:var(--visage-ink)}
.cat-cils{background:var(--cils);color:var(--cils-ink)}.cat-ongles{background:var(--ongles);color:var(--ongles-ink)}
.cat-corps{background:var(--corps);color:var(--corps-ink)}.cat-laser{background:var(--k-soft);color:var(--k-ink)}
/* agenda */
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.d7{height:54px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;position:relative}
.d7 small{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--faint);text-transform:uppercase}
.d7 b{font-size:16px;font-variant-numeric:tabular-nums}
.d7 i{position:absolute;bottom:5px;width:4px;height:4px;border-radius:2px;background:var(--accent)}
.d7.today b{color:var(--accent)}
.d7[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.d7[aria-pressed="true"] small,.d7[aria-pressed="true"] b{color:inherit}
.d7[aria-pressed="true"] i{background:var(--accent-ink)}
.d7.closed{opacity:.45}
.dstrip{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding:12px calc(50% - 27px) 4px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%)}
.dstrip::-webkit-scrollbar{display:none}
.dstrip .d7{flex:0 0 54px;scroll-snap-align:center;transition:transform .15s,background-color .15s}
.dstrip .d7[aria-pressed="true"]{transform:scale(1.08)}
.dstrip .mlab{position:absolute;top:-13px;left:0;font-size:10px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.grid{display:grid;grid-template-columns:38px minmax(0,1fr);gap:0;margin-left:-4px}
.gh{position:sticky;top:0;z-index:4;background:var(--bg);display:grid;gap:6px;padding:6px 0 8px 38px;margin-left:-4px}
.gh div{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;min-width:0}
.gh div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.times{position:relative}
.times span{position:absolute;right:6px;font-size:10.5px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums;transform:translateY(-50%)}
.cols{display:grid;gap:6px}
.cb{position:relative;border-radius:12px;background-color:var(--surface);background-image:repeating-linear-gradient(to bottom,var(--line2) 0,var(--line2) 1px,transparent 1px,transparent var(--hour));cursor:copy;overflow:hidden;border:1px solid var(--line)}
.off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--off) 0,var(--off) 6px,transparent 6px,transparent 12px);background-color:var(--off);opacity:.95;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:var(--faint);pointer-events:none}
.blk{position:absolute;left:3px;right:3px;border-radius:9px;border:0;padding:4px 6px;text-align:left;display:flex;flex-direction:column;gap:0;overflow:hidden;font-size:11.5px;line-height:1.25}
.blk b{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.blk span{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.cat-laser.kk{background:var(--k);color:var(--k-on)}
.blk.absent{opacity:.5;text-decoration:line-through}
.blk.honore::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:4px;background:currentColor;opacity:.55}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:3;pointer-events:none}
.nowl::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:4px;background:var(--now)}
.wk{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px))}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tabs button{border:0;background:none;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--faint);position:relative}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs svg{width:23px;height:23px}
.tabs .kb span.kc{width:46px;height:46px;border-radius:23px;background:var(--k);color:var(--k-on);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px rgba(168,85,88,.35);font-family:var(--display);font-weight:700;font-size:20px;border:3px solid var(--surface)}
.tabs .kb[aria-current="page"]{color:var(--k-ink)}
.fab{position:fixed;z-index:9;right:max(16px, calc(50% - 224px));bottom:calc(84px + env(safe-area-inset-bottom, 0px));height:52px;border-radius:26px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:0 20px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(107,45,92,.3)}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.cta .in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(20,12,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:14px max(18px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow-y:auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center;flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:22px;font-size:13.5px;font-weight:700;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
/* cliente */
.cover{border-radius:24px;height:170px;position:relative;overflow:hidden;background:
  radial-gradient(120px 120px at 82% 30%, rgba(255,255,255,.35), transparent 70%),
  radial-gradient(200px 160px at 10% 110%, rgba(200,121,124,.75), transparent 70%),
  linear-gradient(135deg,#6B2D5C 0%,#8E4A72 55%,#C8797C 100%)}
.cover svg.sw{position:absolute;right:22px;top:26px;opacity:.9}
.cover .badge{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.92);color:#241A22;border-radius:14px;padding:6px 10px;font-size:12px;font-weight:800}
.ilogo{width:72px;height:72px;border-radius:22px;background:var(--surface);border:3px solid var(--bg);margin-top:-46px;margin-left:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;color:var(--accent);position:relative;box-shadow:var(--shadow)}
.stars{color:#C98A1B;letter-spacing:1px}
.acc-h{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:12px 2px;font-weight:800;font-size:15.5px;text-align:left;border-bottom:1px solid var(--line)}
.acc-h span.n{font-size:12.5px;color:var(--faint);font-weight:700}
.kcard{border-radius:22px;overflow:hidden;background:var(--k-soft);border:1px solid transparent}
.kcard .kh{background:var(--k);color:var(--k-on);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kcard .kb2{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.kword{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.4px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.steps.k i.on{background:var(--k)}
.daysc{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.daysc::-webkit-scrollbar{display:none}
.dsc{min-width:58px;height:66px;border-radius:15px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;flex-shrink:0}
.dsc small{font-size:10.5px;font-weight:800;color:var(--faint);text-transform:uppercase}
.dsc b{font-size:18px}
.dsc em{font-style:normal;font-size:10px;font-weight:700;color:var(--ok)}
.dsc.none em{color:var(--faint)}
.dsc[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dsc[aria-pressed="true"] small,.dsc[aria-pressed="true"] em{color:inherit}
.dsc.k[aria-pressed="true"]{background:var(--k);border-color:var(--k);color:var(--k-on)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}

(function(){

/* ---------- utils ---------- */

const addDays=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d)};
const TODAY=iso(new Date());
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const hm=m=>Math.floor(m/60)+'h'+(m%60?pad(m%60):'');

const eur=n=>{const r=Math.round(n*100)/100;return r.toLocaleString('fr-FR',{minimumFractionDigits:r%1?2:0,maximumFractionDigits:2})+' €'};
const JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const JOURSL=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MOISC=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dlabel=s=>{const d=fromIso(s);return JOURSL[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]};
const dshort=s=>{const d=fromIso(s);return d.getDate()+' '+MOISC[d.getMonth()]};
const dow=s=>fromIso(s).getDay();
const uid=()=>Math.random().toString(36).slice(2,9);
const initials=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const court=n=>{const p=n.split(' ');return p.length>1?p[0]+' '+p[p.length-1][0]+'.':n};
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
function mondayOf(s){const d=fromIso(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)}

/* ---------- reference data ---------- */
const VERSION='4 nov. 2026 · 16h45';
const SW='M80 30 C76 27 70 28 66 32 C54 24 38 18 16 17 C32 26 46 36 55 43 C47 49 38 55 30 58 L9 64 L25 63 L13 79 L33 68 C42 64 50 60 56 56 C59 66 60 76 57 87 C66 75 69 62 67 50 C72 44 76 38 80 34 L86 32 Z';

 P('l3','laser','Demi-jambes',45,120,['maya']),P('l4','laser','Lèvre supérieure',15,39,['maya']),
 P('l5','laser','Jambes complètes',60,190,['maya']),P('l6','laser','SIF',15,49,['maya'])
];
const pack=(prix,n)=>Math.round(prix*n*(n===5?0.85:0.75));
const NOMS=['Camille Roux','Nora Benali','Sarah Lopez','Léa Toussaint','Chloé Perrin','Manon Girard','Emma Dubois','Sophie Martin','Julia Costa','Alice Vidal','Zoé Klein','Margaux Henry','Anaïs Fabre','Lou Morel','Clara Simon','Mélanie Robert','Juliette Faure','Laura Petit','Océane Blanc','Pauline Garnier','Elsa Mercier','Lina Haddad','Agathe Leroy','Inès Marchand'];

/* ---------- seed ---------- */
function seed(){
  const R=rng(20261104);
  const pick=a=>a[Math.floor(R()*a.length)];
  const clients=NOMS.map((n,i)=>({id:'c'+i,nom:n,tel:'06 '+pad(10+Math.floor(R()*89))+' •• •• '+pad(10+Math.floor(R()*89)),
    mail:n.split(' ')[0].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')+'@exemple.fr',
    notes:i===0?'Peau sensible, préfère la cire tiède.':(i===3?'Préfère les rendez-vous en fin de journée.':''),optin:R()>.25,kookla:i>=17,
    carte:i===2?{nom:'Carte 5 demi-jambes',reste:3,total:5}:(i===6?{nom:'Carte 10 rehaussements',reste:7,total:10}:null)}));
  const catalogue=BASE.map(s=>({...s,actif:!['v4','s4'].includes(s.id)}));
  const rdv=[];
  const kClients=clients.filter(c=>c.kookla).map(c=>c.id);
  const regulars=clients.filter(c=>!c.kookla).map(c=>c.id);
  for(let off=-35;off<=16;off++){
    const date=addDays(TODAY,off);const w=dow(date);
    PK.forEach(p=>{
      const ranges=PRATS[p].h[w]||[];
      const prob=off<0?0.66:off<=2?0.62:off<=7?0.45:0.25;
      const mine=catalogue.filter(s=>s.prats.includes(p));
      ranges.forEach(([a,b])=>{
        let t=a;
        while(t<b){
          if(R()<prob){
            let s=pick(mine);
            if(p==='maya'&&R()<.35)s=pick(mine.filter(x=>x.cat==='laser'));
            if(s.cat==='laser'&&p!=='maya')s=pick(mine.filter(x=>x.cat!=='laser'));
            if(t+s.dur>b){t+=15;continue}
            const isK=s.cat==='laser'&&R()<.75;
            const cid=isK?pick(kClients):pick(regulars);
            const past=off<0||(off===0&&t+s.dur<=nowMin());
            let statut='confirme';
            if(past){const x=R();statut=x<.05?'absent':'honore'}
            const src=isK?'kookla':(R()<.6?'en ligne':'téléphone');
            const r={id:uid(),date,start:t,dur:s.dur,soins:[s.id],prat:p,client:cid,statut,source:src,paid:null,acompte:0,note:'',pack:''};
            if(isK){const tot=R()<.5?8:5;r.pack='Pack '+(1+Math.floor(R()*tot))+'/'+tot}
            if(src==='en ligne'&&R()<.45)r.acompte=Math.round(s.prix*.3);
            if(statut==='honore'&&!isK&&!(off===0&&R()<.6)){const x=R();r.paid={mode:x<.68?'CB':x<.84?'Espèces':x<.94?'Carte de séances':'Bon cadeau',montant:s.prix,date}}
            rdv.push(r);t+=s.dur+(R()<.5?0:15);
          } else t+=15;
        }
      });
    });
  }
  return {
    v:1,mode:'salon',tab:'agenda',jour:firstOpen(TODAY),vue:'jour',filtre:'all',clientId:null,menu:null,cq:'',cf:'all',sheet:null,
    clients,catalogue,rdv,
    attente:[{id:uid(),nom:'Clara Simon',soin:'s1',date:TODAY},{id:uid(),nom:'Pauline Garnier',soin:'v1',date:addDays(TODAY,1)}],
    conges:[{id:uid(),prat:'julie',date:addDays(TODAY,9)}],
    ventes:[
      {id:uid(),type:'Bon cadeau',nom:'Bon cadeau 80 €',montant:80,date:addDays(TODAY,-2),acheteur:'Marc D.'},
      {id:uid(),type:'Carte',nom:'Carte 5 demi-jambes',montant:93,date:addDays(TODAY,-5),acheteur:'Sarah L.'},
      {id:uid(),type:'Bon cadeau',nom:'Bon « Soin hydratant »',montant:65,date:addDays(TODAY,-8),acheteur:'Julien P.'},
      {id:uid(),type:'Bon cadeau',nom:'Bon cadeau 50 €',montant:50,date:addDays(TODAY,-12),acheteur:'Hélène V.'},

    produits:{'bon-libre':true,'bon-soin':true,'bon-pause':true,'carte-dj':true,'carte-rh':true,'abo-visage':false},
    formule:'plus',kookla:{statut:'actif',niveau:'partenaire'},packsMois:7,

    auto:{rappelSms:true,rappelMail:true,relance:true,anniv:false,avis:true,attente:true},
    sms:480,

    c:{page:'home',step:'soins',cart:[],prat:'any',date:null,t:null,tp:null,open:'cire',editId:null,form:{},k:{},g:{},lastId:null}
  };
}
function firstOpen(from){let d=from;for(let i=0;i<14;i++){if(PK.some(p=>(PRATS[p].h[dow(d)]||[]).length))return d;d=addDays(d,1)}return from}

/* ---------- helpers on state ---------- */
const SOIN=id=>S.catalogue.find(s=>s.id===id);

function workRanges(p,date){if(S.conges.some(c=>c.prat===p&&c.date===date))return [];return PRATS[p].h[dow(date)]||[]}
function busy(p,date,a,b,ignore){return S.rdv.some(r=>r.id!==ignore&&r.prat===p&&r.date===date&&r.statut!=='annule'&&a<r.start+r.dur&&r.start<b)}
function canDo(p,ids){return ids.every(id=>SOIN(id).prats.includes(p))}
function slotsFor(date,ids,pref,ignore){
  if(!ids.length)return [];
  const dur=ids.reduce((a,id)=>a+SOIN(id).dur,0);
  if(date<TODAY)return [];
  const min=date===TODAY?nowMin()+S.reglages.delai:0;
  const prats=(pref&&pref!=='any')?[pref]:PK.filter(p=>canDo(p,ids));
  const m=new Map();
  prats.forEach(p=>workRanges(p,date).forEach(([a,b])=>{for(let t=a;t+dur<=b;t+=15){if(t<min)continue;if(!busy(p,date,t,t+dur,ignore)&&!m.has(t))m.set(t,p)}}));
  return [...m.entries()].sort((x,y)=>x[0]-y[0]).map(([t,p])=>({t,p}));
}
function clientStats(id){
  const rs=S.rdv.filter(r=>r.client===id);

  const spent=done.reduce((a,r)=>a+(r.paid?r.paid.montant:rdvPrice(r)),0);
  const past=rs.filter(r=>r.date<TODAY||(r.date===TODAY&&r.start<nowMin())).sort((a,b)=>(b.date+hh(b.start)).localeCompare(a.date+hh(a.start)));
  const next=rs.filter(r=>r.statut!=='annule'&&(r.date>TODAY||(r.date===TODAY&&r.start>=nowMin()))).sort((a,b)=>(a.date+hh(a.start)).localeCompare(b.date+hh(b.start)));
  const first=rs.slice().sort((a,b)=>(a.date+hh(a.start)).localeCompare(b.date+hh(b.start)))[0];
  return {visites:done.length,spent,absences:rs.filter(r=>r.statut==='absent').length,last:past[0]||null,next,past,first};
}

const swallow=(w,fill,bg)=>`<svg class="sw" width="${w}" height="${w}" viewBox="0 0 100 100" aria-hidden="true">${bg?`<rect width="100" height="100" rx="24" fill="${bg}"/>`:''}<path fill="${fill}" d="${SW}"/></svg>`;

const GS=540,GE=1200,PX=1.6;
function statusPill(r){
  if(r.statut==='annule')return '<span class="pill">Annulé</span>';
  if(r.statut==='absent')return '<span class="pill bad">Absente</span>';
  if(r.statut==='honore')return r.paid||r.source==='kookla'?'<span class="pill ok">Honoré · réglé</span>':'<span class="pill warn">Honoré · à encaisser</span>';
  if(r.statut==='arrive')return '<span class="pill acc">Arrivée</span>';
  return '<span class="pill">Confirmé</span>';
}
function srcPill(r){
  if(r.source==='kookla')return `<span class="pill k">Kookla${r.pack?' · '+esc(r.pack):''}</span>`;
  if(r.source==='en ligne')return '<span class="pill acc">Réservé en ligne</span>';
  return '<span class="pill">Par téléphone</span>';
}
function dayKpis(d){
  const dayR=S.rdv.filter(r=>r.date===d&&r.statut!=='annule');
  const cap_=PK.reduce((a,p)=>a+workRanges(p,d).reduce((x,[s,e])=>x+e-s,0),0);
  const booked=dayR.reduce((a,r)=>a+r.dur,0);
  const ca=dayR.reduce((a,r)=>a+rdvPrice(r),0);
  return `<div class="kpis"><div class="kpi"><b>${dayR.length}</b><span>rendez-vous</span></div><div class="kpi"><b>${eur(ca)}</b><span>CA prévu</span></div><div class="kpi"><b>${cap_?Math.round(booked/cap_*100):0} %</b><span>remplissage</span></div></div>`;
}
function blkHTML(r,px,extraStyle,showPrat){
  const c=CLIENT(r.client),h=r.dur*px-3,cat=rdvCat(r),kk=r.source==='kookla';
  return `<button class="blk cat-${cat} ${kk?'kk':''} ${r.statut}" style="top:${(r.start-GS)*px+1}px;height:${h}px;${extraStyle||''}" data-a="rdv" data-id="${r.id}" aria-label="${hm(r.start)}, ${esc(c.nom)}, ${esc(rdvNames(r))}, avec ${PRATS[r.prat].nom}">
    <b>${showPrat?`<i class="pdot p-${r.prat}"></i>`:''}${hm(r.start)} ${esc(court(c.nom))}</b>${h>34?`<span>${kk?'K · ':''}${esc(rdvNames(r))}</span>`:''}</button>`;
}
function nowLine(d,px){return d===TODAY&&nowMin()>GS&&nowMin()<GE?`<div class="nowl" style="top:${(nowMin()-GS)*px}px"></div>`:''}
function hoursCol(px){const H=(GE-GS)*px;const h=[];for(let m=GS;m<=GE;m+=60)h.push(`<span style="top:${(m-GS)*px}px">${m/60}h</span>`);return `<div class="times" style="height:${H}px">${h.join('')}</div>`}
function dayGrid(d,px){
  const dayR=S.rdv.filter(r=>r.date===d&&r.statut!=='annule');
  const prats=PK.filter(p=>(S.filtre==='all'||S.filtre===p)&&workRanges(p,d).length);
  if(!prats.length)return `<div class="card empty"><b>${S.filtre==='all'?'Institut fermé ce jour-là':PRATS[S.filtre].nom+' ne travaille pas ce jour-là'}</b><br><button class="link" data-a="jour" data-v="${firstOpen(addDays(d,1))}" style="margin-top:8px">Aller au prochain jour d’ouverture</button></div>`;
  const H=(GE-GS)*px;
  const cols=prats.map(p=>{
    const rs=workRanges(p,d);const offs=[];let cur=GS;
    rs.forEach(([a,b],i)=>{if(a>cur)offs.push(`<div class="off" style="top:${(cur-GS)*px}px;height:${(a-cur)*px}px">${i>0?'Pause':''}</div>`);cur=b});
    if(cur<GE)offs.push(`<div class="off" style="top:${(cur-GS)*px}px;height:${(GE-cur)*px}px"></div>`);
    const blks=dayR.filter(r=>r.prat===p).map(r=>blkHTML(r,px)).join('');
    return `<div class="cb" data-a="grid" data-p="${p}" data-date="${d}" data-px="${px}" style="height:${H}px;--hour:${60*px}px">${offs.join('')}${blks}${nowLine(d,px)}</div>`;
  }).join('');
  return `<div class="agrid"><div class="gh" style="grid-template-columns:repeat(${prats.length},minmax(0,1fr))">${prats.map(p=>{const n=dayR.filter(r=>r.prat===p).length;return `<div>${pAv(p)}<span>${PRATS[p].nom}</span><em class="desk-only">${n} RDV</em></div>`}).join('')}</div>
    <div class="grid">${hoursCol(px)}<div class="cols" style="grid-template-columns:repeat(${prats.length},minmax(0,1fr))">${cols}</div></div>
    <p class="foot">Cliquez sur un créneau vide pour ajouter un rendez-vous.</p></div>`;
}
function weekGrid(week,px){
  const H=(GE-GS)*px;
  const head=`<div class="wgh"><span></span>${week.map(x=>{const n=S.rdv.filter(r=>r.date===x&&r.statut!=='annule'&&(S.filtre==='all'||r.prat===S.filtre)).length;
    return `<button class="wgd ${x===TODAY?'today':''}" data-a="goday" data-v="${x}"><small>${JOURS[dow(x)].replace('.','')}</small><b>${fromIso(x).getDate()}</b><em>${n?n+' RDV':'—'}</em></button>`}).join('')}</div>`;
  const cols=week.map(x=>{
    const prats=PK.filter(p=>S.filtre==='all'||S.filtre===p);
    const ranges=prats.flatMap(p=>workRanges(p,x));
    let offs='',seg=null;
    for(let m=GS;m<GE;m+=15){const w=ranges.some(([a,b])=>m>=a&&m<b);
      if(!w&&seg===null)seg=m;
      if(seg!==null&&(w||m+15>=GE)){const end=w?m:GE;offs+=`<div class="off" style="top:${(seg-GS)*px}px;height:${(end-seg)*px}px"></div>`;seg=null}}
    const rs=S.rdv.filter(r=>r.date===x&&r.statut!=='annule'&&(S.filtre==='all'||r.prat===S.filtre)).sort((a,b)=>a.start-b.start||a.prat.localeCompare(b.prat));
    const pos=[],nl=[];let cl=[],clEnd=-1,lanes=[];
    const flush=()=>{cl.forEach(k=>nl[k]=lanes.length);cl=[];lanes=[]};
    rs.forEach((r,j)=>{if(r.start>=clEnd){flush();clEnd=0}let i=lanes.findIndex(e=>e<=r.start);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=r.start+r.dur;pos[j]=i;cl.push(j);clEnd=Math.max(clEnd,r.start+r.dur)});
    flush();
    const blks=rs.map((r,j)=>{const n=nl[j]||1;return blkHTML(r,px,`left:calc(${pos[j]/n*100}% + 2px);right:auto;width:calc(${100/n}% - 4px);`,true)}).join('');
    return `<div class="cb" data-a="grid" data-date="${x}" data-px="${px}" style="height:${H}px;--hour:${60*px}px">${offs}${blks}${nowLine(x,px)}</div>`;
  }).join('');
  return `<div class="wg">${head}<div class="grid">${hoursCol(px)}<div class="cols" style="grid-template-columns:repeat(7,minmax(0,1fr))">${cols}</div></div>
    <div class="row wrap small" style="gap:12px;margin-top:8px">${PK.map(p=>`<span class="row" style="gap:5px"><i class="pdot p-${p}"></i>${PRATS[p].nom}</span>`).join('')}<span class="sub small">· Couleur du bloc = type de soin</span></div></div>`;
}
function kBanner(d){
  const kRdv=S.rdv.filter(r=>r.date===d&&r.statut!=='annule'&&r.source==='kookla');
  return kPartner()&&kRdv.length?`<button class="notice k" data-a="tab" data-v="kookla" style="border:0;text-align:left;width:100%"><span class="pill k">K</span><span><b>${kRdv.length} séance${kRdv.length>1?'s':''} laser vendue${kRdv.length>1?'s':''} par Kookla</b> ce jour-là, déjà payée${kRdv.length>1?'s':''}.</span></button>`:'';

function attenteNotice(d){

function vAgenda(){
  if(DESK)return vAgendaDesk();
  const d=S.jour,isT=d===TODAY;

  const head=`

    <button class="ibtn" data-a="jour-prev" aria-label="Précédent">${I.left}</button>

  if(S.vue==='semaine')return head+vWeek(week);
  const from=d<addDays(TODAY,-42)?addDays(d,-21):addDays(TODAY,-42);

    return `<button class="d7 ${x===TODAY?'today':''} ${open?'':'closed'} ${f.getDate()===1?'m1':''}" data-a="jour" data-v="${x}" role="option" aria-selected="${x===d}" aria-pressed="${x===d}" aria-label="${dlabel(x)}, ${n} rendez-vous">${f.getDate()===1?`<span class="mlab">${MOISC[f.getMonth()]}</span>`:''}<small>${JOURS[dow(x)].replace('.','')}</small><b>${f.getDate()}</b>${n?'<i></i>':''}</button>`}).join('')}</div>`;
  const filt=`<div class="chips" role="group" aria-label="Filtrer"><button class="chip" data-a="filtre" data-v="all" aria-pressed="${S.filtre==='all'}">Toute l’équipe</button>${PK.map(p=>`<button class="chip" data-a="filtre" data-v="${p}" aria-pressed="${S.filtre===p}">${PRATS[p].nom}</button>`).join('')}</div>`;
  return head+strip+filt+dayKpis(d)+kBanner(d)+attenteNotice(d)+dayGrid(d,PX)+`<button class="fab" data-a="new">${I.plus} RDV</button>`;

function vWeek(week){
  return `<div class="list">${week.map(x=>{
    const rs=S.rdv.filter(r=>r.date===x&&r.statut!=='annule');
    const capm=PK.reduce((a,p)=>a+workRanges(p,x).reduce((y,[s,e])=>y+e-s,0),0);
    const occ=capm?Math.round(rs.reduce((a,r)=>a+r.dur,0)/capm*100):0;
    const k=rs.filter(r=>r.source==='kookla').length;
    return `<button class="wk" data-a="goday" data-v="${x}">
      <span style="display:flex;flex-direction:column;align-items:center"><span class="tag">${JOURS[dow(x)].replace('.','')}</span><b style="font-family:var(--display);font-size:22px;${x===TODAY?'color:var(--accent)':''}">${fromIso(x).getDate()}</b></span>
      <span class="col" style="gap:6px;min-width:0">${capm?`<span class="row between small"><b>${rs.length} RDV</b><span class="sub small">${occ} % rempli</span></span><span class="bar"><i style="width:${occ}%"></i></span>${k&&kPartner()?`<span class="pill ks" style="align-self:flex-start">${k} séance${k>1?'s':''} Kookla</span>`:''}`:'<span class="sub">Fermé</span>'}</span>
      <span class="price">${capm?eur(rs.reduce((a,r)=>a+rdvPrice(r),0)):''}</span></button>`}).join('')}</div>`;

function miniCal(d){
  const f=fromIso(d),y=f.getFullYear(),m=f.getMonth();
  const off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();

    cells.push(`<button class="mc ${x===TODAY?'today':''} ${open?'':'closed'}" data-a="jour" data-v="${x}" aria-pressed="${x===d}" aria-label="${dlabel(x)}">${i}${c?'<i></i>':''}</button>`)}
  return `<div class="card col" style="gap:8px"><div class="row between"><b>${cap(MOIS[m])} ${y}</b><span class="row" style="gap:4px"><button class="ibtn sm" data-a="mois" data-v="-1" aria-label="Mois précédent">${I.left}</button><button class="ibtn sm" data-a="mois" data-v="1" aria-label="Mois suivant">${I.right}</button></span></div>

}
function vAgendaDesk(){
  const d=S.jour,mon=mondayOf(d),week=[...Array(7)].map((_,i)=>addDays(mon,i));

    <div class="row" style="gap:10px"><div class="chips" role="group" aria-label="Filtrer"><button class="chip" data-a="filtre" data-v="all" aria-pressed="${S.filtre==='all'}">Toute l’équipe</button>${PK.map(p=>`<button class="chip" data-a="filtre" data-v="${p}" aria-pressed="${S.filtre===p}">${PRATS[p].nom}</button>`).join('')}</div>

  const wk=S.rdv.filter(r=>week.includes(r.date)&&r.source==='kookla'&&r.statut!=='annule');

    <div class="col" style="gap:8px"><span class="tag">${S.vue==='jour'?'Ce jour-là':'Ce jour : '+dshort(ref)}</span>${dayKpis(ref)}</div>

    <div class="card col" style="gap:8px"><b>${ref===TODAY?'Prochaines arrivées':'Rendez-vous du '+dshort(ref)}</b>${list.length?list.map(r=>`<button class="item" data-a="rdv" data-id="${r.id}" style="padding:8px 10px"><i class="pdot p-${r.prat}"></i><span class="t"><b>${hm(r.start)} · ${esc(court(CLIENT(r.client).nom))}</b><span>${esc(rdvNames(r))}</span></span>${r.source==='kookla'?'<span class="pill k">K</span>':''}</button>`).join(''):'<span class="sub small">Plus de rendez-vous aujourd’hui.</span>'}</div>
    ${att.length?`<div class="card col" style="gap:8px"><b>Liste d’attente</b>${att.map(w=>`<div class="row between small"><span>${esc(w.nom)}</span><span class="sub small">${esc(SOIN(w.soin).nom)} · ${dshort(w.date)}</span></div>`).join('')}</div>`:''}`;
  if(S.vue==='semaine')return tool+`<div class="col" style="gap:12px;min-width:0">${main}</div>`;
  return tool+`<div class="cols2 ag"><div class="col" style="gap:12px;min-width:0">${kBanner(d)}${main}</div><aside class="dside">${aside}</aside></div>`;
}

/* ----- clientes ----- */
function clientTags(c,st){
  const t=[];
  if(c.kookla)t.push('<span class="pill ks">Via Kookla</span>');
  if(st.visites>=6)t.push('<span class="pill ok">Fidèle</span>');
  else if(st.visites<=1)t.push('<span class="pill warn">Nouvelle</span>');
  if(st.absences>=2)t.push('<span class="pill bad">'+st.absences+' absences</span>');
  if(c.carte)t.push('<span class="pill acc">Carte en cours</span>');
  return t.join('');
}
function clientsListHTML(){
  const q=S.cq.trim().toLowerCase();
  const rows=S.clients.map(c=>({c,st:clientStats(c.id)})).filter(({c,st})=>{
    if(q&&!c.nom.toLowerCase().includes(q)&&!c.tel.includes(q))return false;
    if(S.cf==='new')return st.visites<=1;
    if(S.cf==='fid')return st.visites>=6;
    if(S.cf==='k')return c.kookla;
    if(S.cf==='inact')return !st.next.length&&(!st.last||st.last.date<addDays(TODAY,-21));
    return true;

/* ----- kookla (salon) ----- */
function kStats(){
  const mStart=TODAY.slice(0,8)+'01';
  const kr=S.rdv.filter(r=>r.source==='kookla'&&r.statut!=='annule');
  const mois=kr.filter(r=>r.date>=mStart&&r.date<=TODAY);
  const done=mois.filter(r=>r.statut==='honore');
  const ca=done.reduce((a,r)=>a+rdvPrice(r),0);
  const kc=new Set(S.clients.filter(c=>c.kookla).map(c=>c.id));
  const nouvelles=[...kc].filter(id=>{const st=clientStats(id);return st.first&&st.first.date>=addDays(TODAY,-30)}).length||kc.size;
  const next=kr.filter(r=>r.date>TODAY||(r.date===TODAY&&r.start>=nowMin())).sort((a,b)=>(a.date+hh(a.start)).localeCompare(b.date+hh(b.start)));
  const pays=kr.filter(r=>r.statut==='honore'&&r.date<=TODAY).sort((a,b)=>(b.date+hh(b.start)).localeCompare(a.date+hh(a.start))).slice(0,4);
  return {done:done.length,ca,net:ca*.75,nouvelles,next,pays};
}

function vCaisse(){
  const paid=S.rdv.filter(r=>r.paid&&r.paid.date===TODAY);

  const kToday=S.rdv.filter(r=>r.date===TODAY&&r.source==='kookla'&&r.statut==='honore');
  const tot=paid.reduce((a,r)=>a+r.paid.montant,0)+ventes.reduce((a,v)=>a+v.montant,0);
  const modes={};paid.forEach(r=>{modes[r.paid.mode]=(modes[r.paid.mode]||0)+r.paid.montant});ventes.forEach(v=>{modes['En ligne']=(modes['En ligne']||0)+v.montant});
  const todo=S.rdv.filter(r=>r.source!=='kookla'&&!r.paid&&(r.statut==='honore'||r.statut==='arrive'||(r.statut==='confirme'&&r.date===TODAY&&r.start+r.dur<=nowMin()))&&r.date<=TODAY&&r.date>=addDays(TODAY,-7));

  <div class="card col" style="gap:6px"><span class="sub">Encaissé aujourd’hui</span><b style="font-family:var(--display);font-size:34px;letter-spacing:-.02em">${eur(tot)}</b>

    ${kToday.length&&kPartner()?`<span class="pill ks" style="align-self:flex-start">+ ${eur(kToday.reduce((a,r)=>a+rdvPrice(r)*.75,0))} versés par Kookla après les séances</span>`:''}</div>

    <div class="cta"><div class="in"><button class="btn" data-a="c-next" ${c.t!=null&&c.tdate===c.date?'':'disabled'}>${c.t!=null&&c.tdate===c.date?'Continuer · '+cap(JOURS[dow(c.date)])+' '+fromIso(c.date).getDate()+' à '+hm(c.t):'Choisissez un horaire'}</button></div></div>`;
  }
  if(c.step==='infos'){
    const m=me()||{},f=c.form;

    <div class="card col" style="gap:4px"><b>${cap(dlabel(c.date))} à ${hm(c.t)}</b><span class="sub small">avec ${PRATS[c.tp].nom} · Institut Écusson</span></div>

    <form id="f-book" class="list" novalidate>
      <label class="field" for="b-nom">Prénom et nom<input id="b-nom" autocomplete="name" value="${esc(f.nom||m.nom||'')}"></label>
      <label class="field" for="b-tel">Téléphone<input id="b-tel" type="tel" autocomplete="tel" value="${esc(f.tel||(m.tel&&!m.tel.includes('•')?m.tel:'')||'')}"></label>

      <label class="field" for="b-note">Un mot pour l’institut (facultatif)<input id="b-note" value="${esc(f.note||'')}" placeholder="Ex. première fois"></label>
      <label class="row small" for="b-sms" style="gap:10px;font-weight:600"><input id="b-sms" type="checkbox" checked style="width:20px;height:20px"> Recevoir un rappel par SMS la veille</label>

      ${acompte?`<div class="notice">${I.shield}<span>Acompte de <b>${eur(acompte)}</b> à régler maintenant, encaissé au nom de l’institut et déduit le jour du soin. Simulation : aucun paiement réel.</span></div>`:`<div class="notice">${I.euro}<span>Paiement sur place, le jour du soin.</span></div>`}
      <span class="err" id="b-err"></span>
      <button class="btn" type="submit">${acompte?'Payer '+eur(acompte)+' et réserver':(S.reglages.validation?'Envoyer ma demande':'Confirmer le rendez-vous')}</button>
      <p class="foot">Vous réservez auprès d’Institut Écusson. Réservation propulsée par Agendelle.</p>
    </form>`;

      <p class="sub">${esc(rdvNames(r))}<br><b style="color:var(--ink)">${cap(dlabel(r.date))} à ${hm(r.start)}</b> avec ${PRATS[r.prat].nom}</p>
      <p class="sub small">${r.acompte?'Acompte de '+eur(r.acompte)+' réglé (simulation). ':''}Confirmation envoyée par email${S.reglages.validation?' dès que l’institut aura validé':''}.</p>

  return '';
}
function vMesRdv(){
  const m=me();
  if(!m)return `<h1>Mes rendez-vous</h1><div class="card empty">Vous n’avez pas encore de rendez-vous.<br><button class="btn" data-a="c-book" style="margin-top:12px">Prendre rendez-vous</button></div>`;
  const st=clientStats(m.id);
  const card=(r,future)=>{const kk=r.source==='kookla';const limit=new Date(fromIso(r.date).getTime()+r.start*60000-S.reglages.annulation*3600000)>new Date();
    return `<div class="card col" style="gap:8px;${kk?'background:var(--k-soft);border-color:transparent':''}">
      <div class="row between"><b style="font-family:var(--display);font-size:17px">${cap(dlabel(r.date))}</b>${kk?'<span class="pill k">Kookla</span>':statusPill(r)}</div>
      <span>${hm(r.start)} · ${esc(rdvNames(r))}</span><span class="sub small">avec ${PRATS[r.prat].nom} · Institut Écusson${r.pack?' · '+esc(r.pack):''}</span>
      ${future&&r.statut!=='annule'?(kk?'<span class="sub small">Séance gérée dans votre espace Kookla.</span>':(S.c.cancelId===r.id?`<div class="notice warn"><span>Annuler ce rendez-vous ?</span></div><div class="row"><button class="btn sm ghost" data-a="c-cancel-no">Garder</button><button class="btn sm" data-a="c-cancel-yes" data-id="${r.id}">Oui, annuler</button></div>`:
        limit?`<div class="row"><button class="btn sm ghost" data-a="c-edit" data-id="${r.id}">Déplacer</button><button class="btn sm danger" data-a="c-cancel" data-id="${r.id}">Annuler</button></div>`:`<span class="sub small">Moins de ${S.reglages.annulation} h avant : contactez l’institut pour modifier.</span>`)):''}
    </div>`};
  return `<h1>Mes rendez-vous</h1>
  <div class="sec"><h3>À venir</h3>${st.next.length?`<div class="list">${st.next.map(r=>card(r,true)).join('')}</div>`:'<p class="sub">Aucun rendez-vous à venir.</p>'}</div>

  <button class="btn ghost" data-a="c-book">Reprendre rendez-vous</button>`;
}
function vKClient(){
  const k=S.c.k;const lasers=S.catalogue.filter(s=>s.cat==='laser'&&s.actif);
  const band=`<div class="kcard"><div class="kh"><div class="row between"><span class="kword">Kookla</span><button class="ibtn" data-a="k-close" aria-label="Fermer" style="background:rgba(255,255,255,.18);border-color:transparent;color:inherit">${I.x}</button></div><b>Épilation laser chez Institut Écusson</b><span style="font-size:13px;opacity:.9">Vendu et garanti par Kookla · avec Maya</span></div></div>`;
  const step=k.step||'zone';
  const s=k.zone?SOIN(k.zone):null;
  if(step==='zone')return band+`<h2>Quelle zone ?</h2><div class="list">${lasers.map(z=>`<button class="item" data-a="k-zone" data-id="${z.id}"><span class="t"><b>${esc(z.nom)}</b><span>${z.dur} min · séance ${eur(z.prix)}</span></span><span class="col" style="align-items:flex-end"><span class="sub small">pack 8 dès</span><span class="price" style="color:var(--k-ink)">${eur(Math.round(pack(z.prix,8)/8))}/séance</span></span></button>`).join('')}</div>
    <div class="notice k">${I.shield}<span>Questionnaire d’éligibilité en ligne, revu par la laseriste du centre avant la première séance.</span></div>`;
  if(step==='formule'){
    const F=[['1','Séance seule',s.prix,1,''],['5','Pack 5 séances',pack(s.prix,5),5,'−15 %'],['8','Pack 8 séances',pack(s.prix,8),8,'−25 % · le plus choisi']];
    return band+cTop(esc(s.nom),'k-back',4,1,true)+`<div class="list">${F.map(([id,n,p,q,b])=>`<button class="opt k" data-a="k-form" data-v="${id}" aria-pressed="${k.formule===id}"><span class="row between"><b>${n}</b>${b?`<span class="pill ks">${b}</span>`:''}</span><span class="row between"><span class="sub small">${q>1?eur(Math.round(p/q))+' la séance':'Sans engagement'}</span><span class="price" style="font-size:17px">${eur(p)}</span></span></button>`).join('')}</div>
      <div class="list small">${['Séances versées à l’institut une à une, après chaque séance','Garantie anti-faillite : vos séances restantes sont protégées','Paiement en plusieurs fois disponible','Pack valable 24 mois'].map(x=>`<span class="row">${I.shield}<span>${x}</span></span>`).join('')}</div>
      <div class="cta"><div class="in"><button class="btn k" data-a="k-next" ${k.formule?'':'disabled'}>Choisir ma première séance</button></div></div>`;
  }
  if(step==='date'){
    const days=[...Array(21)].map((_,i)=>addDays(TODAY,i));
    const av_=days.map(d=>({d,n:slotsFor(d,[s.id],'maya').length}));
    if(!k.date||!av_.find(x=>x.d===k.date)){const f=av_.find(x=>x.n);k.date=f?f.d:TODAY}
    const sl=slotsFor(k.date,[s.id],'maya');
    return band+cTop('Première séance','k-back',4,2,true)+`
    <div class="daysc">${av_.map(({d,n})=>`<button class="dsc k ${n?'':'none'}" data-a="k-date" data-v="${d}" aria-pressed="${d===k.date}"><small>${JOURS[dow(d)].replace('.','')}</small><b>${fromIso(d).getDate()}</b><em>${n?n+' dispo':'complet'}</em></button>`).join('')}</div>
    <h3>${cap(dlabel(k.date))}</h3>${sl.length?`<div class="slots k">${sl.map(x=>`<button class="slot" data-a="k-slot" data-t="${x.t}" aria-pressed="${k.t===x.t&&k.tdate===k.date}">${hh(x.t)}</button>`).join('')}</div>`:'<p class="sub">Maya ne travaille pas ce jour-là ou c’est complet.</p>'}
    <p class="foot" style="text-align:left">Créneaux en temps réel depuis l’agenda de l’institut. Les séances suivantes se réservent depuis votre espace Kookla.</p>
    <div class="cta"><div class="in"><button class="btn k" data-a="k-next" ${k.t!=null&&k.tdate===k.date?'':'disabled'}>Continuer</button></div></div>`;
  }
  if(step==='compte')return band+cTop('Votre compte Kookla','k-back',4,3,true)+`
    <form id="f-kc" class="list" novalidate>
      <label class="field" for="k-nom">Prénom et nom<input id="k-nom" autocomplete="name" value="${esc(k.nom||(me()?me().nom:''))}"></label>
      <label class="field" for="k-mail">Email<input id="k-mail" type="email" autocomplete="email" value="${esc(k.mail||(me()?me().mail:''))}"></label>
      <span class="err" id="k-err"></span>
      <button class="btn k" type="submit">Continuer</button>
      <p class="foot">Simulation : dans le vrai parcours, la cliente se connecte ou crée son compte Kookla avant de payer.</p></form>`;
  if(step==='pay'){
    const F={'1':[s.prix,'Séance seule'],'5':[pack(s.prix,5),'Pack 5 séances'],'8':[pack(s.prix,8),'Pack 8 séances']}[k.formule];
    return band+cTop('Paiement','k-back',4,4,true)+`
    <div class="card col" style="gap:6px"><div class="row between"><b>Laser ${esc(s.nom.toLowerCase())} · ${F[1]}</b><b>${eur(F[0])}</b></div><span class="sub small">1re séance ${dlabel(k.tdate)} à ${hm(k.t)} avec Maya</span></div>
    <span class="tag">Moyen de paiement</span>
    <div class="list">${[['cb','Carte bancaire'],['apple','Apple Pay'],['klarna','En 3 ou 4 fois avec Klarna']].map(([id,l])=>`<button class="opt k" data-a="k-pm" data-v="${id}" aria-pressed="${(k.pm||'cb')===id}"><b>${l}</b>${id==='klarna'?`<span class="sub small">Soit ${eur(Math.round(F[0]/4*100)/100)} par mois sur 4 mois</span>`:''}</button>`).join('')}</div>
    <div class="notice k">${I.shield}<span>Garantie anti-faillite : l’institut est payé séance par séance. Droit de rétractation de 14 jours, détaillé dans les CGV Kookla.</span></div>
    <div class="cta"><div class="in"><button class="btn k" data-a="k-pay">Payer ${eur(F[0])} (simulation)</button></div></div>`;
  }
  if(step==='ok'){const r=S.rdv.find(x=>x.id===k.rdvId);
    return band+`<div class="card col" style="gap:10px;align-items:center;text-align:center;padding:24px 16px">
      <span style="width:58px;height:58px;border-radius:29px;background:var(--k-soft);color:var(--k-ink);display:grid;place-items:center">${I.check}</span>
      <h1 style="font-size:24px">Votre ${k.formule==='1'?'séance est réservée':'pack est activé'} !</h1>
      <p class="sub">1re séance <b style="color:var(--ink)">${r?cap(dlabel(r.date))+' à '+hm(r.start):''}</b> avec Maya</p>
      <span class="pill ks">K-Coins crédités sur votre compte Kookla</span>
      <p class="sub small">Reçu, CGV et droit de rétractation envoyés par email par Kookla.</p>
      <button class="btn k" data-a="c-mesrdv">Voir mes rendez-vous</button></div>
    <p class="foot">Astuce démo : côté salon, la séance apparaît dans l’agenda de Maya avec le badge Kookla.</p>`}
  return '';
}

function vCliente(){
  const p=S.c.page;

    h=`<div class="steps k">${[1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;

      <div class="notice">${I.check}<span>Repris d’Agendelle : zones laser, prix, horaires, photos. À compléter : technologie laser, phototypes pris en charge.</span></div>
      <button class="btn k" data-a="ka-send">Envoyer ma demande</button>`;
  }
  if(sh.type==='wait'){
    h=`<h2>Être prévenue</h2><p class="sub">${esc(S.c.cart.map(id=>SOIN(id).nom).join(' + '))}. Dès qu’une place se libère, vous recevez un SMS ; la première qui confirme la prend.</p>

  return `<div class="sheet-bg" data-a="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Détail"><span class="grab"></span>${h}<button class="link" data-a="close" style="align-self:center;color:var(--muted)">Fermer</button></div></div>`;
}

function cInstitutCard(){

let stripLeft=null,stripTimer=null;
function setupStrip(){
  const st=document.getElementById('dstrip');
  if(!st){stripLeft=null;return}
  const sel=st.querySelector('[aria-pressed="true"]');
  const target=sel?sel.offsetLeft-(st.clientWidth-sel.offsetWidth)/2:0;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(stripLeft!=null&&Math.abs(stripLeft-target)<st.clientWidth*3&&!reduce){st.scrollLeft=stripLeft;st.scrollTo({left:target,behavior:'smooth'})}
  else st.scrollLeft=target;
  st.addEventListener('scroll',()=>{
    stripLeft=st.scrollLeft;
    clearTimeout(stripTimer);
    stripTimer=setTimeout(()=>{
      const mid=st.scrollLeft+st.clientWidth/2;let best=null,bd=1e9;
      st.querySelectorAll('.d7').forEach(b=>{const c=b.offsetLeft+b.offsetWidth/2,dd=Math.abs(c-mid);if(dd<bd){bd=dd;best=b}});
      if(best&&best.dataset.v!==S.jour){S.jour=best.dataset.v;S.flash=null;try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}render(true)}
    },160);
  },{passive:true});
}

  if(t.id==='cq'){S.cq=t.value;const l=document.getElementById('cl-list');if(l)l.innerHTML=clientsListHTML();return}
  if(t.id==='camp-msg'){S.campMsg=t.value;const nb=Math.max(1,Math.ceil(t.value.length/160));const i=document.getElementById('camp-info');if(i)i.textContent=t.value.length+' caractères · '+nb+' SMS par cliente · '+campCount()+' clientes ayant accepté les messages';save();return}
  if(t.id==='reg-msg'){S.reglages.message=t.value;save();return}
  if(t.closest('form')){const er=t.closest('form').querySelector('.err');if(er)er.textContent=''}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='notes'){CLIENT(t.dataset.id).notes=t.value;save();toast('Note enregistrée');return}
  if(t.dataset.reg){S.reglages[t.dataset.reg]=+t.value;save();toast('Réglage enregistré');return}
  if(t.id==='camp-cible'){S.campCible=t.value;S.campConfirm=false;render(true);return}
  if(t.id==='m-date'){S.sheet.date=t.value;S.sheet.t=null;render(true);return}
  if(t.id==='m-prat'){S.sheet.prat=t.value;S.sheet.t=null;render(true);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render(true)}});
render(false);
})();
</script>
</body>
</html>
